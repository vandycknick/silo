name: Release qualification

on:
  workflow_dispatch:
    inputs:
      kernel_reference:
        description: Verified stable kernel OCI reference
        required: true
        default: ghcr.io/vandycknick/silo/kernel:stable
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-arm64:
    name: macOS 26 arm64 ad-hoc package
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify native release host
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Verify release tooling
        run: |
          nix develop --command cargo fmt --all --check
          nix develop --command cargo test -p xtask
          nix develop --command make clippy

      - name: Build canonical release staging
        env:
          KERNEL_REFERENCE: ${{ inputs.kernel_reference }}
        run: |
          nix develop --command cargo run -p xtask -- release-stage \
            --target darwin-arm64 \
            --kernel-reference "$KERNEL_REFERENCE"

      - name: Build ad-hoc macOS distribution
        env:
          RELEASE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          nix develop --command cargo run -p xtask -- package-macos \
            --build-number "$RELEASE_BUILD_NUMBER"

      - name: Verify non-publishing artifact
        run: |
          metadata=target/silo-artifacts/darwin-arm64/macos/macos.json
          nix develop --command jq -e \
            '.target == "darwin-arm64" and .signing == "ad-hoc" and .notarized == false' \
            "$metadata"
          /usr/bin/codesign --verify --deep --strict --verbose=4 \
            target/silo-artifacts/darwin-arm64/macos/Silo.app

      - name: Upload qualification artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm64-ad-hoc-${{ github.sha }}
          path: |
            target/silo-artifacts/darwin-arm64/macos/
            target/silo-release/darwin-arm64/release/metadata/
          if-no-files-found: error
          retention-days: 14
