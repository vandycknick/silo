name: System Image

on:
  push:
    branches:
      - main
    paths:
      - 'resources/images/system/**'
      - 'guest/portd/**'
      - 'app/cli/**'
      - 'virt/vmm/**'
      - 'net/netd/**'
      - 'guest/agent/**'
      - 'guest/init/**'
      - 'specs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/system-image.yml'
  pull_request:
    paths:
      - 'resources/images/system/**'
      - 'guest/portd/**'
      - 'app/cli/**'
      - 'virt/vmm/**'
      - 'net/netd/**'
      - 'guest/agent/**'
      - 'guest/init/**'
      - 'specs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/system-image.yml'
  workflow_dispatch:
    inputs:
      publish_dev:
        description: Publish the inspected multi-architecture image as dev instead of latest
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/silo/system

jobs:
  build:
    name: build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Configure BuildKit
        run: |
          docker buildx create --driver docker-container --name silo-image-builder --use
          docker buildx inspect --bootstrap

      - name: Build native image archive
        run: >-
          nix develop --command make -C resources/images/system archive
          ARCH=${{ matrix.arch }}
          IMAGE=system-candidate:${{ github.sha }}-${{ matrix.arch }}
          SOURCE_REVISION=${{ github.sha }}

      - name: Inspect image contract
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          TAG: system-candidate:${{ github.sha }}-${{ matrix.arch }}
        run: |
          docker load --input resources/images/system/.dist/system-image.tar
          test "$(docker image inspect "$TAG" --format '{{.Architecture}}')" = "$EXPECTED_ARCH"
          test "$(docker image inspect "$TAG" --format '{{index .Config.Labels "io.silo.system.schema"}}')" = 1
          docker run --rm --entrypoint jq "$TAG" -e \
            --arg architecture "$EXPECTED_ARCH" \
            '.schema == 1 and .architecture == $architecture and .engine == "docker"' \
            /usr/lib/silo-system/manifest.json
          docker run --rm --entrypoint dockerd "$TAG" --validate --config-file=/etc/docker/daemon.json
          docker run --rm --entrypoint cat "$TAG" /usr/lib/silo-system/packages.tsv \
            > resources/images/system/.dist/packages.tsv
          sha256sum resources/images/system/.dist/system-image.tar \
            resources/images/system/.dist/packages.tsv \
            resources/images/system/.dist/build-metadata.json \
            > resources/images/system/.dist/SHA256SUMS

      - name: Upload inspected image inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: system-image-${{ matrix.arch }}
          path: resources/images/system/.dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  # Pushes to main (and manual runs on main) move `latest`, which every silo CLI
  # tracks. `publish_dev` publishes any branch as `dev` for testing instead.
  publish:
    name: publish ${{ inputs.publish_dev && 'dev' || 'latest' }} index
    if: >-
      ${{ github.repository == 'vandycknick/silo' && (inputs.publish_dev ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.publish_dev && 'dev' || 'latest' }}
    steps:
      - name: Download inspected image archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: system-image-*
          path: target/system-images

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish architecture images and index
        run: |
          for arch in amd64 arm64; do
            docker load --input "target/system-images/system-image-$arch/system-image.tar"
            source="system-candidate:${GITHUB_SHA}-$arch"
            target="$IMAGE:$TAG-$arch"
            docker tag "$source" "$target"
            docker push "$target"
          done
          docker buildx imagetools create \
            --tag "$IMAGE:$TAG" \
            "$IMAGE:$TAG-amd64" \
            "$IMAGE:$TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$TAG"
