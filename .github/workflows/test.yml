name: Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'resources/kernels/**'
      - '.github/workflows/kernel.yml'
  pull_request:
    paths-ignore:
      - 'resources/kernels/**'
      - '.github/workflows/kernel.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    outputs:
      node: ${{ steps.result.outputs.node }}
      go: ${{ steps.result.outputs.go }}
      taild: ${{ steps.result.outputs.taild }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Detect SDK and taild changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            node:
              - 'vendor/signal-hook-registry/**'
              - '.github/workflows/test.yml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'Makefile'
              - 'VERSION'
              - 'flake.lock'
              - 'flake.nix'
              - 'runtime/libvm/**'
              - 'common/policy/**'
              - 'specs/**'
              - 'sdk/node/**'
            go:
              - 'vendor/signal-hook-registry/**'
              - '.github/workflows/test.yml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'Makefile'
              - 'VERSION'
              - 'flake.lock'
              - 'flake.nix'
              - 'nix/**'
              - 'runtime/libvm/**'
              - 'common/policy/**'
              - 'specs/**'
              - 'sdk/go/**'
              - 'xtask/**'
            taild:
              - 'vendor/signal-hook-registry/**'
              - '.github/workflows/test.yml'
              - 'packaging/silo-taild/**'
              - 'nix/**'
              - 'app/taild/**'
              - 'app/cli/**'
              - 'common/vm-control/**'
              - 'sdk/go/**'
              - 'runtime/**'
              - 'guest/**'
              - 'virt/**'
              - 'net/netd/**'
              - 'common/policy/**'
              - 'common/secrets/**'
              - 'Makefile'
              - 'xtask/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'VERSION'
              - 'specs/**'
              - 'flake.lock'
              - 'flake.nix'

      - name: Select checks
        id: result
        env:
          NODE_CHANGED: ${{ steps.filter.outputs.node }}
          GO_CHANGED: ${{ steps.filter.outputs.go }}
          TAILD_CHANGED: ${{ steps.filter.outputs.taild }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            printf 'node=true\ngo=true\ntaild=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'node=%s\ngo=%s\ntaild=%s\n' "$NODE_CHANGED" "$GO_CHANGED" "$TAILD_CHANGED" >> "$GITHUB_OUTPUT"
          fi

  # Clippy, Cargo, netd and taild tests stay per-OS: the workspace has
  # platform-only crates (virt/vz on macOS, libkrun in silo-vmm on both hosts)
  # and Go build tags that a single lane would silently stop covering.
  # Platform-independent style and consistency checks run once, on the Linux
  # cell. Portable packaging is qualified by release-tip.yml, not here.
  core:
    name: Core (${{ matrix.platform }})
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            primary: true
            target: linux-amd64-gnu
            ffi_library: libsilo_go_ffi.so
          - platform: macos
            runner: macos-26
            primary: false
            target: darwin-arm64
            ffi_library: libsilo_go_ffi.dylib

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2.9.1
        with:
          cmd-format: nix develop .#ci --command {0}
          workspaces: . -> target
          prefix-key: test
          shared-key: workspace
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check Rust formatting
        if: ${{ matrix.primary }}
        run: nix develop .#ci --command make fmt

      - name: Check Go formatting
        if: ${{ matrix.primary }}
        run: |
          files="$(nix develop .#ci --command gofmt -l sdk/go app/taild)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi

      - name: Check versions
        if: ${{ matrix.primary }}
        run: nix develop .#ci --command make version-check

      - name: Run Clippy
        run: nix develop .#ci --command make clippy

      # Cargo integration discovery includes tests/krun_worker.rs on both hosts.
      # These real-process boundary tests need no successful hypervisor admission.
      # make test also tests net/netd (race-enabled on Linux); make fmt gofmt-checks it.
      - name: Run host-aware tests, including the private silo-vmm worker boundary
        run: nix develop .#ci --command make test

      - name: Vet netd
        env:
          GOTOOLCHAIN: auto
          GOFLAGS: -mod=readonly
        run: nix develop .#ci --command go -C net/netd vet ./...

      # Guest components cross-compile with cargo-zigbuild, which only the
      # default shell carries. The debug stage reuses the artifacts make test
      # already built; any complete stage satisfies the taild fixtures.
      - name: Build and stage the integrated development product
        if: needs.changes.outputs.taild == 'true'
        run: nix develop --command make stage

      - name: Vet taild
        if: needs.changes.outputs.taild == 'true'
        env:
          CGO_ENABLED: '1'
          GOTOOLCHAIN: auto
          GOFLAGS: -mod=readonly
          SILO_GO_FFI_PATH: ${{ github.workspace }}/target/debug/${{ matrix.ffi_library }}
        run: nix develop .#ci --command go -C app/taild vet ./...

      - name: Test taild with actual bridge and race detector
        if: needs.changes.outputs.taild == 'true'
        # VM-fixture tests retain their explicit host/rootfs opt-in.
        env:
          CGO_ENABLED: '1'
          GOTOOLCHAIN: auto
          GOFLAGS: -mod=readonly
          SILO_GO_FFI_PATH: ${{ github.workspace }}/target/debug/${{ matrix.ffi_library }}
          SILO_TEST_RUNTIME_ROOT: ${{ github.workspace }}/target/silo-runtime/${{ matrix.target }}/debug
          SILO_RUNTIME_DIR: ${{ github.workspace }}/target/silo-runtime/${{ matrix.target }}/debug
          SILO_TEST_BIN_DIR: ${{ github.workspace }}/target/debug
          SILO_TEST_CLI: ${{ github.workspace }}/target/debug/silo
        run: nix develop .#ci --command go -C app/taild test -race -count=1 -timeout=4m -v ./...

  node-sdk:
    name: Node SDK (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2.9.1
        with:
          cmd-format: nix develop .#ci --command {0}
          workspaces: . -> target
          prefix-key: test
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Node SDK dependencies
        run: nix develop .#ci --command npm --prefix sdk/node ci

      # Building the TypeScript facade already typechecks it; there is no
      # separate typecheck step.
      - name: Build Node SDK
        run: nix develop .#ci --command npm --prefix sdk/node run build

      - name: Test Node SDK
        run: nix develop .#ci --command npm --prefix sdk/node test

  go-sdk:
    name: Go SDK (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every cell builds the native bridge and runs the full suite;
          # platform-independent checks run only on the primary cell.
          # saves_cache marks the cells with no Core counterpart on the same
          # architecture, which therefore have to populate the shared cache
          # themselves instead of restoring one Core already wrote.
          - platform: linux-amd64
            runner: ubuntu-24.04
            primary: true
            saves_cache: false
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            primary: false
            saves_cache: true
          - platform: macos-arm64
            runner: macos-26
            primary: false
            saves_cache: false

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # Core builds the whole workspace in the same dev profile, so its cache
      # is a superset of what the bridge needs. Share it rather than keeping a
      # second copy, and let only one job per architecture write it.
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2.9.1
        with:
          cmd-format: nix develop .#ci --command {0}
          workspaces: . -> target
          prefix-key: test
          shared-key: workspace
          cache-bin: false
          save-if: ${{ matrix.saves_cache && github.ref == 'refs/heads/main' }}

      - name: Build native Go bridge
        run: nix develop .#ci --command cargo build --locked -p silo-go-ffi

      - name: Verify generated Go FFI header is current
        if: ${{ matrix.primary }}
        run: git diff --exit-code -- sdk/go/native/include/silo_go_ffi.h

      - name: Test Go SDK
        env:
          CGO_ENABLED: "1"
          SILO_GO_FFI_PATH: ${{ github.workspace }}/target/debug/${{ runner.os == 'macOS' && 'libsilo_go_ffi.dylib' || 'libsilo_go_ffi.so' }}
        run: nix develop .#ci --command go -C sdk/go test -race -count=1 ./...

      - name: Vet Go SDK
        if: ${{ matrix.primary }}
        env:
          CGO_ENABLED: "1"
          SILO_GO_FFI_PATH: ${{ github.workspace }}/target/debug/libsilo_go_ffi.so
        run: nix develop .#ci --command go -C sdk/go vet ./...

      - name: Build a clean consumer module
        if: ${{ matrix.primary }}
        env:
          CGO_ENABLED: "1"
        run: |
          consumer="$(mktemp -d)"
          cd "$consumer"
          nix develop "$GITHUB_WORKSPACE#ci" --command go mod init example.com/silo-consumer
          nix develop "$GITHUB_WORKSPACE#ci" --command go mod edit -replace github.com/vandycknick/silo/sdk/go="$GITHUB_WORKSPACE/sdk/go"
          cat > main.go <<'EOF'
          package main
          import (
            "context"
            "github.com/vandycknick/silo/sdk/go"
          )
          func contracts(runtime *silo.Runtime, machine *silo.Machine, policy *silo.NetworkPolicy) {
            ctx := context.Background()
            name := "exact"
            labels := map[string]string{"io.silo.taild.name": name}
            _, _ = machine.Update(ctx, silo.MachineUpdate{Name: &name, Labels: &labels})
            _, _ = machine.StopWith(ctx, silo.StopOptions{Force: true})
            _, _ = machine.WaitReady(ctx, 1)
            _, _ = runtime.Inventory(ctx)
            _, _ = runtime.PolicySecretsReady(ctx, policy, "")
            _, _ = silo.ParseNetworkPolicyHCL(`tailscale "vm" { ephemeral = false }`)
            _, _ = policy.HCL()
            _, _ = policy.SecretMetadata()
            _ = silo.WithGuestUser("silo", 1000, 1000, "/home/silo")
            _ = silo.WithExecInitialPTYSize(24, 80)
            _ = silo.WithExecTerm("xterm")
          }
          func main() { _, _ = silo.InstalledRuntime(); _ = contracts }
          EOF
          nix develop "$GITHUB_WORKSPACE#ci" --command go mod tidy
          nix develop "$GITHUB_WORKSPACE#ci" --command go build ./...

  summary:
    name: Summary
    if: always()
    needs:
      - changes
      - core
      - node-sdk
      - go-sdk
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
