name: Test

# Keep this unfiltered: branch protection needs stable checks, and docs contain package inputs.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Check formatting
        run: nix develop --command make fmt

      - name: Check versions
        run: nix develop .#release --command make version-check

      - name: Run Clippy
        run: nix develop --command make clippy

      - name: Run tests
        run: nix develop --command make test

  node-sdk:
    name: node SDK (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Install Node SDK dependencies
        run: nix develop --command npm --prefix sdk/node ci

      - name: Build Node SDK
        run: nix develop --command npm --prefix sdk/node run build

      - name: Typecheck Node SDK
        run: nix develop --command npm --prefix sdk/node run typecheck

      - name: Test Node SDK
        run: nix develop --command npm --prefix sdk/node test
