name: Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'resources/kernels/**'
      - '.github/workflows/kernel.yml'
  pull_request:
    paths-ignore:
      - 'resources/kernels/**'
      - '.github/workflows/kernel.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Clippy, Cargo and netd tests stay per-OS: the workspace has platform-only
  # crates (virt/vz on macOS, libkrun in silo-vmm on both hosts) and Go build
  # tags that a single lane would silently stop covering. Platform-independent
  # style and consistency checks run once, on the primary Linux cell. Portable
  # packaging is qualified by release-tip.yml, not here.
  core:
    name: Core (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
            primary: true
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            primary: false
          - platform: macos
            runner: macos-26
            primary: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          cmd-format: nix develop .#ci --command {0}
          workspaces: . -> target
          prefix-key: test
          shared-key: workspace
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check Rust formatting
        if: ${{ matrix.primary }}
        run: nix develop .#ci --command make fmt

      - name: Check Go formatting
        if: ${{ matrix.primary }}
        run: |
          files="$(nix develop .#ci --command gofmt -l net/netd app/tsgate)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi

      - name: Check versions
        if: ${{ matrix.primary }}
        run: nix develop .#ci --command make version-check

      - name: Run Clippy
        run: nix develop .#ci --command make clippy

      # Cargo integration discovery includes tests/krun_worker.rs on both hosts.
      # These real-process boundary tests need no successful hypervisor admission.
      # make test also tests net/netd and app/tsgate (race-enabled on Linux);
      # make fmt gofmt-checks both.
      - name: Run host-aware tests, including the private silo-vmm worker boundary
        run: nix develop .#ci --command make test

      - name: Vet netd
        env:
          GOTOOLCHAIN: auto
          GOFLAGS: -mod=readonly
        run: nix develop .#ci --command go -C net/netd vet ./...

      - name: Vet tsgate
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: auto
          GOFLAGS: -mod=readonly
        run: nix develop .#ci --command go -C app/tsgate vet ./...

  summary:
    name: Summary
    if: always()
    needs:
      - core
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
