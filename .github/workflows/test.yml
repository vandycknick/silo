name: Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'resources/kernels/**'
      - '.github/workflows/kernel.yml'
  pull_request:
    paths-ignore:
      - 'resources/kernels/**'
      - '.github/workflows/kernel.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    outputs:
      node: ${{ steps.result.outputs.node }}
      go: ${{ steps.result.outputs.go }}
      netd: ${{ steps.result.outputs.netd }}
      taild: ${{ steps.result.outputs.taild }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Detect SDK and netd changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            node:
              - 'vendor/signal-hook-registry/**'
              - '.github/workflows/test.yml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'Makefile'
              - 'VERSION'
              - 'flake.lock'
              - 'flake.nix'
              - 'runtime/libvm/**'
              - 'common/policy/**'
              - 'specs/**'
              - 'sdk/node/**'
            go:
              - 'vendor/signal-hook-registry/**'
              - '.github/workflows/test.yml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'Makefile'
              - 'VERSION'
              - 'flake.lock'
              - 'flake.nix'
              - 'nix/**'
              - 'runtime/libvm/**'
              - 'common/policy/**'
              - 'specs/**'
              - 'sdk/go/**'
              - 'xtask/**'
            netd:
              - '.github/workflows/test.yml'
              - 'net/netd/**'
              - 'common/policy/**'
              - 'flake.lock'
              - 'flake.nix'
              - 'nix/**'
            taild:
              - 'vendor/signal-hook-registry/**'
              - '.github/workflows/test.yml'
              - '.github/workflows/release-tip.yml'
              - 'packaging/silo-taild/**'
              - 'PACKAGING.md'
              - 'nix/**'
              - 'app/taild/**'
              - 'app/silod/**'
              - 'app/cli/**'
              - 'common/config/**'
              - 'common/vm-control/**'
              - 'sdk/go/**'
              - 'runtime/**'
              - 'guest/**'
              - 'virt/**'
              - 'net/netd/**'
              - 'common/policy/**'
              - 'common/secrets/**'
              - 'Makefile'
              - 'xtask/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'VERSION'
              - 'specs/**'
              - 'flake.lock'
              - 'flake.nix'

      - name: Select checks
        id: result
        env:
          NODE_CHANGED: ${{ steps.filter.outputs.node }}
          GO_CHANGED: ${{ steps.filter.outputs.go }}
          NETD_CHANGED: ${{ steps.filter.outputs.netd }}
          TAILD_CHANGED: ${{ steps.filter.outputs.taild }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            printf 'node=true\ngo=true\nnetd=true\ntaild=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'node=%s\ngo=%s\nnetd=%s\ntaild=%s\n' "$NODE_CHANGED" "$GO_CHANGED" "$NETD_CHANGED" "$TAILD_CHANGED" >> "$GITHUB_OUTPUT"
          fi

  # Clippy and Cargo tests stay per-OS: the workspace has platform-only
  # crates (virt/vz on macOS, libkrun in silo-vmm on both hosts) that a single lane
  # would silently stop covering. Platform-independent style and
  # consistency checks run once, on the Linux cell.
  checks:
    name: Checks (${{ matrix.platform }})
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            primary: true
          - platform: macos
            runner: macos-26
            primary: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          cmd-format: nix develop .#ci --command {0}
          workspaces: . -> target
          prefix-key: test
          shared-key: workspace
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check Rust formatting
        if: ${{ matrix.primary }}
        run: nix develop .#ci --command make fmt

      - name: Check Go formatting
        if: ${{ matrix.primary }}
        run: test -z "$(nix develop .#ci --command gofmt -l sdk/go)"

      - name: Check versions
        if: ${{ matrix.primary }}
        run: nix develop .#ci --command make version-check

      - name: Run Clippy
        run: nix develop .#ci --command make clippy

      # Cargo integration discovery includes tests/krun_worker.rs on both hosts.
      # These real-process boundary tests need no successful hypervisor admission.
      - name: Run host-aware tests, including the private silo-vmm worker boundary
        run: nix develop .#ci --command make test

  node-sdk:
    name: Node SDK (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          cmd-format: nix develop .#ci --command {0}
          workspaces: . -> target
          prefix-key: test
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Node SDK dependencies
        run: nix develop .#ci --command npm --prefix sdk/node ci

      # Building the TypeScript facade already typechecks it; there is no
      # separate typecheck step.
      - name: Build Node SDK
        run: nix develop .#ci --command npm --prefix sdk/node run build

      - name: Test Node SDK
        run: nix develop .#ci --command npm --prefix sdk/node test

  go-sdk:
    name: Go SDK (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every cell builds the native bridge and runs the full suite;
          # platform-independent checks run only on the primary cell.
          # saves_cache marks the cells with no Checks counterpart on the same
          # architecture, which therefore have to populate the shared cache
          # themselves instead of restoring one Checks already wrote.
          - platform: linux-amd64
            runner: ubuntu-24.04
            primary: true
            saves_cache: false
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            primary: false
            saves_cache: true
          - platform: macos-arm64
            runner: macos-26
            primary: false
            saves_cache: false

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Checks builds the whole workspace in the same dev profile, so its cache
      # is a superset of what the bridge needs. Share it rather than keeping a
      # second copy, and let only one job per architecture write it.
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          cmd-format: nix develop .#ci --command {0}
          workspaces: . -> target
          prefix-key: test
          shared-key: workspace
          cache-bin: false
          save-if: ${{ matrix.saves_cache && github.ref == 'refs/heads/main' }}

      - name: Build native Go bridge
        run: nix develop .#ci --command cargo build --locked -p silo-go-ffi

      - name: Verify generated Go FFI header is current
        if: ${{ matrix.primary }}
        run: git diff --exit-code -- sdk/go/native/include/silo_go_ffi.h

      - name: Test Go SDK
        env:
          CGO_ENABLED: "1"
          SILO_GO_FFI_PATH: ${{ github.workspace }}/target/debug/${{ runner.os == 'macOS' && 'libsilo_go_ffi.dylib' || 'libsilo_go_ffi.so' }}
        run: nix develop .#ci --command go -C sdk/go test -race -count=1 ./...

      - name: Vet Go SDK
        if: ${{ matrix.primary }}
        env:
          CGO_ENABLED: "1"
          SILO_GO_FFI_PATH: ${{ github.workspace }}/target/debug/libsilo_go_ffi.so
        run: nix develop .#ci --command go -C sdk/go vet ./...

      - name: Build a clean consumer module
        if: ${{ matrix.primary }}
        env:
          CGO_ENABLED: "1"
        run: |
          consumer="$(mktemp -d)"
          cd "$consumer"
          nix develop "$GITHUB_WORKSPACE#ci" --command go mod init example.com/silo-consumer
          nix develop "$GITHUB_WORKSPACE#ci" --command go mod edit -replace github.com/vandycknick/silo/sdk/go="$GITHUB_WORKSPACE/sdk/go"
          cat > main.go <<'EOF'
          package main
          import (
            "context"
            "github.com/vandycknick/silo/sdk/go"
          )
          func contracts(runtime *silo.Runtime, machine *silo.Machine, policy *silo.NetworkPolicy) {
            ctx := context.Background()
            name := "exact"
            labels := map[string]string{"io.silo.taild.name": name}
            _, _ = machine.Update(ctx, silo.MachineUpdate{Name: &name, Labels: &labels})
            _, _ = machine.StopWith(ctx, silo.StopOptions{Force: true})
            _, _ = machine.WaitReady(ctx, 1)
            _, _ = runtime.Inventory(ctx)
            _, _ = runtime.PolicySecretsReady(ctx, policy, "")
            _, _ = silo.ParseNetworkPolicyHCL(`tailscale "vm" { ephemeral = false }`)
            _, _ = policy.HCL()
            _, _ = policy.SecretMetadata()
            _ = silo.WithGuestUser("silo", 1000, 1000, "/home/silo")
            _ = silo.WithExecInitialPTYSize(24, 80)
            _ = silo.WithExecTerm("xterm")
          }
          func main() { _, _ = silo.InstalledRuntime(); _ = contracts }
          EOF
          nix develop "$GITHUB_WORKSPACE#ci" --command go mod tidy
          nix develop "$GITHUB_WORKSPACE#ci" --command go build ./...

  netd:
    name: netd (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.netd == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: auto
      GOFLAGS: -mod=readonly
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Verify netd toolchain
        run: nix develop .#ci --command go -C net/netd version

      - name: Check netd formatting
        run: |
          files="$(nix develop .#ci --command gofmt -l net/netd)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi

      - name: Vet netd
        run: nix develop .#ci --command go -C net/netd vet ./...

      - name: Test netd with race detector
        run: nix develop .#ci --command go -C net/netd test -race -count=1 -timeout=4m ./...

  taild:
    name: taild (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.taild == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64-gnu
            runner: ubuntu-24.04
            library: libsilo_go_ffi.so
          - platform: darwin-arm64
            runner: macos-26
            library: libsilo_go_ffi.dylib
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: auto
      GOFLAGS: -mod=readonly
      SILO_GO_FFI_PATH: ${{ github.workspace }}/target/debug/${{ matrix.library }}
      SILO_TEST_RUNTIME_ROOT: ${{ github.workspace }}/target/silo-runtime/${{ matrix.platform }}/release
      SILO_RUNTIME_DIR: ${{ github.workspace }}/target/silo-runtime/${{ matrix.platform }}/release
      SILO_TEST_BIN_DIR: ${{ github.workspace }}/target/debug
      SILO_TEST_CLI: ${{ github.workspace }}/target/debug/silo
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          cmd-format: nix develop .#ci --command {0}
          workspaces: . -> target
          prefix-key: test
          shared-key: workspace
          cache-bin: false
          save-if: false
      - name: Build integrated development product and release runtime fixtures
        timeout-minutes: 25
        run: |
          nix develop --command make build
          nix develop --command make stage PROFILE=release
      - name: Check taild formatting
        run: |
          files="$(nix develop .#ci --command gofmt -l app/taild)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Vet taild
        run: nix develop .#ci --command go -C app/taild vet ./...
      - name: Test taild with actual bridge and race detector
        # VM-fixture tests retain their explicit host/rootfs opt-in. The package
        # lane separately requires real helper startup and native bridge loading.
        run: nix develop .#ci --command go -C app/taild test -p 1 -race -count=1 -timeout=4m -v ./...

  taild-package:
    name: taild package (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.taild == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64-gnu
            runner: ubuntu-24.04
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Build integrated native product and portable package
        run: nix develop .#release --command make archive
      - name: Build native management and exact-ID acceptance driver
        run: nix develop .#release --command go -C app/taild build -o "$GITHUB_WORKSPACE/target/artifact-driver" ../../packaging/silo-taild/kvm.go
      - name: Exercise packaged executable without development overrides
        env:
          PLATFORM: ${{ matrix.platform }}
          SILO_ARTIFACT_DRIVER: ${{ github.workspace }}/target/artifact-driver
        run: |
          version="$(tr -d '\n' < VERSION)"
          nix develop .#release --command python3 packaging/silo-taild/verify-artifact.py "target/packages/$version/$PLATFORM/silo-$version-$PLATFORM.tar.zst" "target/packages/$version/$PLATFORM/silo-runtime-$version-$PLATFORM.tar.zst"
      - name: Build and admit actual signed native app
        if: ${{ matrix.platform == 'darwin-arm64' }}
        env:
          SILO_ARTIFACT_DRIVER: ${{ github.workspace }}/target/artifact-driver
        run: |
          nix develop .#release --command make app
          version="$(tr -d '\n' < VERSION)"
          output="target/packages/$version/darwin-arm64"
          nix develop .#release --command python3 packaging/silo-taild/verify-artifact.py "$output/silo-$version-darwin-arm64.tar.zst" "$output/silo-runtime-$version-darwin-arm64.tar.zst" --app "$output/Silo.app" --audit-only

  summary:
    name: Summary
    if: always()
    needs:
      - changes
      - checks
      - node-sdk
      - go-sdk
      - netd
      - taild
      - taild-package
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
