name: Release Tip

# Run after Test completes rather than independently of validated source.
# Do not filter release work: commit metadata affects release artifacts.
on:
  workflow_run:
    workflows:
      - Test
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-tip
  cancel-in-progress: true

jobs:
  prepare:
    name: prepare release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Resolve release revision
        id: release
        env:
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          printf 'release_sha=%s\n' "$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$(tr -d '\n' < VERSION)" >> "$GITHUB_OUTPUT"
          {
            printf '## Release Tip\n\n'
            printf "Release SHA: \`%s\`\n" "$RELEASE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  core:
    name: core (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64-gnu
            runner: ubuntu-24.04
            create_dmg: false
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            create_dmg: false
          - platform: darwin-arm64
            runner: macos-26
            create_dmg: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cmd-format: nix develop .#release --command {0}
          workspaces: . -> target
          prefix-key: release-tip-platform
          key: ${{ matrix.platform }}-${{ hashFiles('flake.lock') }}
          cache-bin: false

      - name: Select Xcode 26.6
        if: ${{ matrix.platform == 'darwin-arm64' }}
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Build release archives
        run: nix develop .#release --command make archive

      - name: Accept packaged product
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: nix develop .#release --command scripts/accept-packaged-product.sh "target/packages/$VERSION/$PLATFORM"

      - name: Build macOS package
        if: ${{ matrix.create_dmg }}
        run: nix develop .#release --command make package DMG=1

      - name: Stage core artifacts for transfer
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p target/upload/core
          cp -R "target/packages/$VERSION/$PLATFORM/." target/upload/core/
          rm -rf target/upload/core/Silo.app

      - name: Upload core artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: silo-${{ matrix.platform }}-core
          path: target/upload/core
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  summary:
    name: release summary
    if: always()
    needs:
      - prepare
      - core
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful release preparation
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
