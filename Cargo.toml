[workspace]
members = [
    "app/cli",
    "common/policy",
    "common/disk-image",
    "xtask",
    "common/utils",
    "guest/agent",
    "guest/init",
    "guest/portd",
    "guest/rprobe",
    "runtime/oci",
    "runtime/libvm",
    "runtime/test-utils",
    "runtime/vmmon",
    "sdk/node",
    "sdk/go/native",
    "virt/krun",
    "virt/vz",
    "specs/agent-spec",
    "specs/forward-spec",
    "specs/protocol",
    "specs/vm-spec",
]
default-members = ["app/cli", "runtime/vmmon"]
resolver = "2"

[workspace.dependencies]
libkrun = { package = "libkrun", git = "https://github.com/vandycknick/libkrun.git", rev = "041237ac66aec612aae13eb11b06309b6e96eefb", default-features = false, features = ["blk", "net"] }

[profile.dev.package.sha2]
opt-level = 3
