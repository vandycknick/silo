[workspace]
members = [
    "app/cli",
    "common/vm-control",
    "common/policy",
    "common/secrets",
    "common/disk-image",
    "common/disk-partition",
    "xtask",
    "common/utils",
    "guest/agent",
    "guest/init",
    "guest/portd",
    "guest/rprobe",
    "runtime/oci",
    "runtime/libvm",
    "runtime/test-utils",
    "sdk/node",
    "sdk/go/native",
    "virt/vmm",
    "virt/vz",
    "specs/agent-spec",
    "specs/forward-spec",
    "specs/protocol",
    "specs/rootfs-spec",
    "specs/silod-spec",
    "specs/vm-spec",
]
default-members = ["app/cli", "virt/vmm"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zeroize = "1.9.0"
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.19"
tempfile = "3.27.0"
libkrun = { package = "libkrun", git = "https://github.com/vandycknick/libkrun.git", rev = "58253c00580bda34f5ea9fc4e0fccaf1e09a83d4", default-features = false, features = ["blk", "net"] }

[profile.dev.package.sha2]
opt-level = 3

[patch.crates-io]
signal-hook-registry = { path = "vendor/signal-hook-registry" }

[patch."https://github.com/vandycknick/libkrun.git"]
libkrun = { path = "/home/nickvd/Projects/worktrees/libkrun/silo-production/src/libkrun" }
