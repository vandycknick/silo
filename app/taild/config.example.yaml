home: /var/lib/silo-taild
install_root: /var/lib/silo-taild/runtimes
# runtime_archive: /var/cache/silo-taild/silo-runtime.tar.zst
disk_reserve: 1GiB
shutdown:
  stop_budget: 4s
  margin: 250ms
secrets_dir: /etc/silo-taild/secrets
templates_dir: /etc/silo-taild/templates
policies_dir: /etc/silo-taild/policies
tailnet:
  hostname: silo
  tag: tag:silo
  capability: github.com/vandycknick/silo/cap/taild
enrollment:
  mode: oauth-app
  disable_key_expiry: false
vm:
  default_image: ghcr.io/vandycknick/silo/devbox:latest
  allowed_registries: [ghcr.io/vandycknick]
  defaults: {cpus: 2, memory: 4GiB, disk: 20GiB}
  ceilings: {cpus: 8, memory: 32GiB, disk: 200GiB, vms_per_principal: 5}
sessions: {global: 64, per_peer: 8}
