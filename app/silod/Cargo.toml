[package]
name = "silod"
version = "0.1.0"
edition = "2021"
default-run = "silod"

[[bin]]
name = "silod"
path = "src/main.rs"

[dependencies]
silod-spec = { path = "../../specs/silod-spec" }
libvm = { path = "../../runtime/libvm" }
vm-spec = { path = "../../specs/vm-spec" }
utils = { path = "../../common/utils" }
disk-image = { path = "../../common/disk-image" }
clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
nix = { version = "0.31.3", features = ["fs", "user"] }
chrono = "0.4.45"
eyre = "0.6.12"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "time", "sync", "signal"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
nix = { version = "0.31.3", features = ["signal"] }
tempfile = "3.27.0"
