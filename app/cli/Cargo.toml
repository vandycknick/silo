[package]
name = "cli"
version = "0.1.0"
edition = "2021"
default-run = "silo"

[lib]
name = "cli"
path = "lib/lib.rs"

[[bin]]
name = "silo"
path = "bin/main.rs"

[dependencies]
ssh-key = { version = "0.7.0-rc.11", default-features = false, features = ["ed25519", "std"] }
secrets = { path = "../../common/secrets" }
silod-spec = { path = "../../specs/silod-spec" }
silo-config = { path = "../../common/config" }
silo-vm-control = { path = "../../common/vm-control" }
libvm = { path = "../../runtime/libvm" }
vm-spec = { path = "../../specs/vm-spec" }
utils = { path = "../../common/utils" }
base64 = "0.23.0"
clap = { version = "4.6.4", features = ["derive"] }
console = "0.16.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
libc = "0.2.189"
nix = { version = "0.31.3", features = ["fs", "user"] }
chrono = "0.4.45"
eyre = "0.6.12"
indicatif = "0.18.6"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "rustls"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "time", "io-std", "sync", "signal"] }
tokio-stream = "0.1.19"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
tonic = { version = "0.14.6", features = ["transport"] }

[dev-dependencies]
tempfile = "3.27.0"
