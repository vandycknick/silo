[package]
name = "cli"
version = "0.1.0"
edition = "2021"
default-run = "silo"

[lib]
name = "cli"
path = "lib/lib.rs"

[[bin]]
name = "silo"
path = "bin/main.rs"

[dependencies]
ssh-key = { version = "0.7.0-rc.11", default-features = false, features = ["ed25519", "std"] }
secrets = { path = "../../common/secrets" }
silod-spec = { path = "../../specs/silod-spec" }
silo-vm-control = { path = "../../common/vm-control" }
libvm = { path = "../../runtime/libvm" }
vm-spec = { path = "../../specs/vm-spec" }
utils = { path = "../../common/utils" }
disk-image = { path = "../../common/disk-image" }
base64 = "0.23.0"
clap = { version = "4.6.4", features = ["derive"] }
console = "0.16.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
serde_yaml_ng = "0.10.0"
libc = "0.2.189"
nix = { version = "0.31.3", features = ["fs", "user", "process", "signal"] }
chrono = "0.4.45"
eyre = "0.6.12"
indicatif = "0.18.6"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "rustls"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "time", "io-std", "sync", "signal", "net", "process"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
tonic = { version = "0.14.6", features = ["transport"] }
zeroize = { workspace = true }
tracing = "0.1.44"
futures = "0.3.33"
prost-types = "0.14.4"
prost = "0.14.4"
parking_lot = "0.12.5"
tower = "0.5.3"
tempfile = "3.27.0"

[dev-dependencies]
hyper-util = "0.1.20"
tonic-prost = "0.14.6"
