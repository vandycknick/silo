syntax = "proto3";
package silo.daemon.v1;
option go_package = "github.com/vandycknick/silo/specs/protocol/go/silo/daemon/v1;daemonv1";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

service DaemonService {
 rpc GetStatus(google.protobuf.Empty) returns (DaemonStatus);
 rpc GetRuntimeInfo(google.protobuf.Empty) returns (RuntimeInfo);
 rpc ReportTailscaleStatus(TailscaleStatusReport) returns (google.protobuf.Empty);
 rpc DrainMutations(DrainMutationsRequest) returns (google.protobuf.Empty);
 rpc GetLiveCapabilities(google.protobuf.Empty) returns (LiveHostReport);
}
service MachineService {
 rpc ListMachines(google.protobuf.Empty) returns (stream MachineInventoryEntry);
 rpc InspectInventory(MachineRef) returns (MachineInventoryEntry);
 rpc InspectMachine(MachineRef) returns (MachineSnapshot);
 rpc EnsureNameAvailable(Name) returns (google.protobuf.Empty);
 rpc CreateMachine(CreateMachineRequest) returns (stream CreateMachineEvent);
 rpc StartMachine(StartMachineRequest) returns (MachineStart);
 rpc StopMachine(StopMachineRequest) returns (MachineSnapshot);
 rpc RemoveMachine(RemoveMachineRequest) returns (google.protobuf.Empty);
 rpc UpdateMachine(UpdateMachineRequest) returns (MachineSnapshot);
 rpc WaitReady(WaitReadyRequest) returns (MachineReadiness);
 rpc StopRun(StopRunRequest) returns (MachineSnapshot);
 rpc KillRun(KillRunRequest) returns (MachineExit);
 rpc WaitForRun(WaitForRunRequest) returns (MachineExit);
 rpc RemoveAfterRun(MachineRunRef) returns (google.protobuf.Empty);
 rpc ReadLogs(ReadLogsRequest) returns (stream LogChunk);
 rpc SetMachineSecret(SetMachineSecretRequest) returns (google.protobuf.Empty);
 rpc PauseMachine(LiveMachineRequest) returns (MachineSnapshot);
 rpc ResumeMachine(LiveMachineRequest) returns (MachineSnapshot);
 rpc CaptureExecution(LiveCaptureRequest) returns (LiveSnapshotInfo);
 rpc ForkExecution(LiveForkRequest) returns (google.protobuf.Empty);
 rpc ForkStopped(StoppedForkRequest) returns (MachineSnapshot);
 rpc SnapshotStopped(CreateStorageSnapshotRequest) returns (StorageSnapshotInfo);
}
service NetworkService {
 rpc ListNetworkDefinitions(google.protobuf.Empty) returns (stream NetworkDefinition);
 rpc GetNetworkDefinition(Name) returns (OptionalNetworkDefinition);
 rpc CreateNetworkDefinition(CreateNetworkDefinitionRequest) returns (google.protobuf.Empty);
 rpc RemoveNetworkDefinition(Name) returns (google.protobuf.Empty);
 rpc SetMachineNetwork(SetMachineNetworkRequest) returns (MachineSnapshot);
}
service RuntimeService {
 rpc ResolveImage(ResolveImageRequest) returns (stream ResolveImageEvent);
 rpc PullImage(PullImageRequest) returns (stream ImageProgress);
 rpc ProposeMachineName(google.protobuf.Empty) returns (Name);
 rpc ParseResource(ParseResourceRequest) returns (Size);
 rpc NormalizePolicy(NormalizePolicyRequest) returns (PolicyDocument);
 rpc CheckPolicySecrets(CheckPolicySecretsRequest) returns (PolicySecretsResult);
 rpc RestoreExecution(LiveRestoreRequest) returns (google.protobuf.Empty);
 rpc RestoreSnapshot(RestoreStorageSnapshotRequest) returns (MachineSnapshot);
 rpc InspectStorageSnapshot(StorageSnapshotRef) returns (StorageSnapshotInfo);
 rpc ListStorageSnapshots(google.protobuf.Empty) returns (StorageSnapshotList);
 rpc ReleaseSnapshotRetention(StorageSnapshotRef) returns (google.protobuf.Empty);
 rpc RemoveImageAlias(Name) returns (google.protobuf.Empty);
}
message Name { string name = 1; }
message MachineRef { oneof reference { string id = 1; string name = 2; string id_prefix = 3; } }
message MachineRunRef { string id = 1; string run_id = 2; }
message StringList { repeated string values = 1; }
message StringMap { map<string,string> values = 1; }
message EnvironmentPair { string name = 1; string value = 2; }
message ProcessConfig { StringList entrypoint = 1; StringList command = 2; map<string,string> environment = 3; string working_directory = 4; optional string user = 5; }
enum Retention { RETENTION_UNSPECIFIED = 0; RETENTION_PERSISTENT = 1; RETENTION_EPHEMERAL = 2; }
message Agent { oneof mode { google.protobuf.Empty default_agent = 1; google.protobuf.Empty none = 2; bytes custom_path = 3; } }
message User { string name = 1; uint32 uid = 2; uint32 gid = 3; string home = 4; }
message GuestConfig { Agent agent = 1; User user = 2; }
message Mount { bytes source = 1; string tag = 2; bool read_only = 3; }
enum DiskRole { DISK_ROLE_UNSPECIFIED = 0; DISK_ROLE_ROOT = 1; DISK_ROLE_ROOT_LOWER = 2; DISK_ROLE_ROOT_UPPER = 3; DISK_ROLE_DATA = 4; }
enum DiskFormat { DISK_FORMAT_UNSPECIFIED = 0; DISK_FORMAT_RAW = 1; DISK_FORMAT_VMDK = 2; }
message DiskGeometry { uint64 length = 1; uint32 logical_sector_size = 2; }
message Disk { bytes path = 1; optional bool read_only = 2; optional DiskRole role = 3; optional DiskFormat format = 4; DiskGeometry geometry = 5; optional string block_id = 6; }
message Address { oneof address { string tcp = 1; bytes unix = 2; } }
message Endpoint { oneof endpoint { Address host = 1; Address guest = 2; uint32 vsock = 3; } }
message Forward { Endpoint listen = 1; Endpoint connect = 2; optional uint32 unix_mode = 3; optional string name = 4; }
message ForwardList { repeated Forward values = 1; }
message Vsock { bool enabled = 1; optional bytes uds = 2; }
message Kernel { optional bytes path = 1; repeated string cmdline = 2; optional bytes initramfs = 3; }
message Boot { Kernel kernel = 1; optional string userdata = 2; }
message Hardware { optional uint32 cpus = 1; optional uint64 memory_bytes = 2; optional bool nested_virtualization = 3; optional bool rosetta = 4; }
message Storage { repeated Disk disks = 1; }
enum GuestOs { GUEST_OS_UNSPECIFIED = 0; GUEST_OS_LINUX = 1; }
message VmGuest { optional GuestOs os = 1; }
message VmSpec { string spec_version = 1; VmGuest guest = 2; Boot boot = 3; Hardware hardware = 4; Storage storage = 5; repeated Mount mounts = 6; repeated Forward forwards = 7; Vsock vsock = 8; map<string,string> annotations = 9; }
enum PublishBind { PUBLISH_BIND_UNSPECIFIED = 0; PUBLISH_BIND_LOOPBACK = 1; PUBLISH_BIND_ANY = 2; }
message PrivateNetwork { optional string policy_json = 1; optional PublishBind publish = 2; }
message ResolvedNetwork { oneof attachment { PrivateNetwork private = 1; google.protobuf.Empty none = 2; Name named = 3; } }
enum NetworkTopology { NETWORK_TOPOLOGY_UNSPECIFIED = 0; NETWORK_TOPOLOGY_NAT = 1; NETWORK_TOPOLOGY_BRIDGE = 2; NETWORK_TOPOLOGY_ISOLATED = 3; }
enum NetworkDriver { NETWORK_DRIVER_UNSPECIFIED = 0; NETWORK_DRIVER_AUTO = 1; NETWORK_DRIVER_NETD = 2; }
message NetworkDefinition { string name = 1; NetworkTopology topology = 2; NetworkDriver driver = 3; }
message OptionalNetworkDefinition { NetworkDefinition definition = 1; }
message CreateNetworkDefinitionRequest { NetworkDefinition definition = 1; }
message SetMachineNetworkRequest { MachineRef machine = 1; ResolvedNetwork network = 2; }
enum RootProfile { ROOT_PROFILE_UNSPECIFIED = 0; ROOT_PROFILE_OPAQUE_RAW = 1; ROOT_PROFILE_LINUX_FLAT_OVERLAY_V1 = 2; }
message TemporaryDirectoryPolicy { oneof backing { google.protobuf.Empty disk_backed = 1; uint64 tmpfs_capacity_bytes = 2; } }
message NormalizedMachineCreate { optional string name = 1; optional string template_name = 2; map<string,string> labels = 3; ProcessConfig process = 4; Retention retention = 5; optional bytes kernel = 6; optional bytes initramfs = 7; repeated string kernel_args = 8; bool nested_virtualization = 9; bool rosetta = 10; repeated bytes disks = 11; repeated Mount mounts = 12; repeated Forward forwards = 13; optional bool vsock = 14; optional uint32 cpus = 15; optional uint64 memory_bytes = 16; optional uint64 root_disk_size_bytes = 17; optional string userdata = 18; ResolvedNetwork network = 19; Agent agent = 20; User provision_user = 21; optional RootProfile root_profile = 22; TemporaryDirectoryPolicy temporary_directory = 23; }
enum PullPolicy { PULL_POLICY_UNSPECIFIED = 0; PULL_POLICY_IF_MISSING = 1; PULL_POLICY_ALWAYS = 2; PULL_POLICY_NEVER = 3; }
enum CacheState { CACHE_STATE_UNSPECIFIED = 0; CACHE_STATE_COMPLETE = 1; CACHE_STATE_MISSING = 2; }
message OciIdentity { string requested_reference = 1; string selected_reference = 2; string platform = 3; string manifest_digest = 4; string config_digest = 5; PullPolicy pull_policy = 6; }
message ResolvedImage { OciIdentity identity = 1; CacheState cache_state = 2; string oci_config_json = 3; }
message CreateMachineRequest { NormalizedMachineCreate configuration = 1; oneof source { OciIdentity oci = 2; bytes disk_path = 3; } }
message ImageReferenceProgress { string image_ref = 1; }
message ManifestProgress { string image_ref = 1; string manifest_digest = 2; uint64 layer_count = 3; optional uint64 total_download_bytes = 4; }
message LayerProgress { uint64 index = 1; uint64 total = 2; string digest = 3; optional uint64 size_bytes = 4; uint64 downloaded_bytes = 5; }
message ApplyingLayerProgress { uint64 index = 1; uint64 total = 2; optional string digest = 3; }
message ImageProgress { oneof event { ImageReferenceProgress resolving_manifest = 1; ManifestProgress resolved_manifest = 2; ImageReferenceProgress checking_cache = 3; ImageReferenceProgress cache_hit = 4; ImageReferenceProgress cache_miss = 5; ImageReferenceProgress using_local_disk = 6; LayerProgress layer_download_started = 7; LayerProgress layer_download_progress = 8; LayerProgress layer_download_verifying = 9; LayerProgress layer_download_finished = 10; LayerProgress layer_download_skipped = 11; ApplyingLayerProgress applying_layer = 12; google.protobuf.Empty materializing_rootfs = 13; google.protobuf.Empty publishing_rootfs = 14; google.protobuf.Empty complete = 15; } }
message CreateMachineEvent { oneof event { ImageProgress progress = 1; MachineSnapshot machine = 2; } }
message ResolveImageRequest { string reference = 1; PullPolicy pull_policy = 2; }
message ResolveImageEvent { oneof event { ImageProgress progress = 1; ResolvedImage image = 2; } }
message PullImageRequest { string reference = 1; }
message EgressSecret { string slot = 1; bytes value = 2; }
message Entrypoint { string program = 1; repeated string args = 2; optional string cwd = 3; repeated EnvironmentPair environment = 4; optional string user = 5; }
message StartOptions { bool cleanup_on_exit = 1; repeated EgressSecret egress_secrets = 2; Entrypoint entrypoint = 3; }
message StartMachineRequest { MachineRef machine = 1; StartOptions options = 2; }
message StopMachineRequest { MachineRef machine = 1; bool force = 2; google.protobuf.Duration timeout = 3; optional string expected_run = 4; }
message RemoveMachineRequest { MachineRef machine = 1; }
message PolicyUpdate { oneof update { string set = 1; google.protobuf.Empty clear = 2; } }
message PublicationUpdate { oneof update { PublishBind set = 1; google.protobuf.Empty clear = 2; } }
message UserUpdate { oneof update { User set = 1; google.protobuf.Empty clear = 2; } }
message MachineUpdate { optional string name = 1; StringMap labels = 2; optional uint32 cpus = 3; optional uint64 memory_bytes = 4; optional uint64 root_disk_size_bytes = 5; optional bool nested_virtualization = 6; optional bool rosetta = 7; ForwardList forwards = 8; Vsock vsock = 9; ResolvedNetwork network = 10; PolicyUpdate policy = 11; PublicationUpdate publication = 12; GuestConfig guest = 13; UserUpdate user = 14; TemporaryDirectoryPolicy temporary_directory = 15; }
message UpdateMachineRequest { MachineRef machine = 1; MachineUpdate update = 2; }
message WaitReadyRequest { string id = 1; optional string expected_run = 2; google.protobuf.Duration timeout = 3; }
message StopRunRequest { MachineRunRef machine = 1; google.protobuf.Duration timeout = 2; optional google.protobuf.Duration force_after = 3; }
message KillRunRequest { MachineRunRef machine = 1; google.protobuf.Duration timeout = 2; }
message WaitForRunRequest { MachineRunRef machine = 1; google.protobuf.Duration timeout = 2; }
enum Observation { OBSERVATION_UNSPECIFIED = 0; OBSERVATION_OBSERVED = 1; OBSERVATION_LAST_KNOWN = 2; OBSERVATION_UNAVAILABLE = 3; }
enum IssueComponent { ISSUE_COMPONENT_UNSPECIFIED = 0; ISSUE_COMPONENT_LIFECYCLE = 1; ISSUE_COMPONENT_TELEMETRY = 2; ISSUE_COMPONENT_NETWORK = 3; ISSUE_COMPONENT_ROOTFS = 4; ISSUE_COMPONENT_CONFIGURATION = 5; }
message MachineIssue { IssueComponent component = 1; string message = 2; }
message LifecycleDetail { optional string message = 1; }
message RunningStatus { bool ready = 1; bool guest_ready = 2; optional string message = 3; }
message MachineStatus { oneof status { google.protobuf.Empty stopped = 1; LifecycleDetail starting = 2; RunningStatus running = 3; LifecycleDetail stopping = 4; LifecycleDetail error = 5; LifecycleDetail pausing = 6; LifecycleDetail paused = 7; LifecycleDetail capturing = 8; LifecycleDetail restoring = 9; LifecycleDetail activating = 10; LifecycleDetail activation_failed = 11; } }
enum ImageSourceKind { IMAGE_SOURCE_KIND_UNSPECIFIED = 0; IMAGE_SOURCE_KIND_OCI = 1; IMAGE_SOURCE_KIND_DISK = 2; }
message Rootfs { ImageSourceKind source_kind = 1; string requested_reference = 2; optional string selected_reference = 3; optional string manifest_digest = 4; optional string config_digest = 5; optional string image_id = 6; bytes root_disk_path = 7; uint64 root_disk_size_bytes = 8; google.protobuf.Timestamp created_at = 9; }
message MachineTailscale { bytes state_dir = 1; string hostname = 2; bool ephemeral = 3; }
enum BootMode { BOOT_MODE_UNSPECIFIED = 0; BOOT_MODE_STANDARD = 1; BOOT_MODE_AGENT_PID1 = 2; BOOT_MODE_INIT_CHILD = 3; }
message BootReport { BootMode mode = 1; optional string requested_init = 2; optional string handoff_init_path = 3; repeated string probed_init_paths = 4; optional string agent_path = 5; uint32 agent_pid = 6; bool agent_is_pid1 = 7; optional string message = 8; }
enum ProvisionStatus { PROVISION_STATUS_UNSPECIFIED = 0; PROVISION_STATUS_SUCCEEDED = 1; PROVISION_STATUS_DEGRADED = 2; PROVISION_STATUS_SKIPPED = 3; PROVISION_STATUS_FAILED_BOOT = 4; }
enum ProvisionStepStatus { PROVISION_STEP_STATUS_UNSPECIFIED = 0; PROVISION_STEP_STATUS_SUCCEEDED = 1; PROVISION_STEP_STATUS_FAILED = 2; PROVISION_STEP_STATUS_SKIPPED = 3; PROVISION_STEP_STATUS_UNSUPPORTED = 4; }
enum ProvisionFailurePolicy { PROVISION_FAILURE_POLICY_UNSPECIFIED = 0; PROVISION_FAILURE_POLICY_BEST_EFFORT = 1; PROVISION_FAILURE_POLICY_FAIL_BOOT = 2; }
message ProvisionStepReport { string id = 1; ProvisionStepStatus status = 2; ProvisionFailurePolicy failure_policy = 3; bool changed = 4; optional string backend = 5; google.protobuf.Duration duration = 6; optional string message = 7; optional string error_chain = 8; }
message ProvisionReport { ProvisionStatus status = 1; google.protobuf.Timestamp started_at = 2; google.protobuf.Timestamp finished_at = 3; google.protobuf.Duration duration = 4; repeated ProvisionStepReport steps = 5; optional string message = 6; }
message MachineSnapshot { string id = 1; string name = 2; VmSpec spec = 3; Retention retention = 4; ProcessConfig process = 5; optional string template_name = 6; Agent agent_mode = 7; bytes machine_dir = 8; google.protobuf.Timestamp created_at = 9; google.protobuf.Timestamp modified_at = 10; string image_ref = 11; Rootfs rootfs = 12; optional uint64 root_disk_size = 13; map<string,string> labels = 14; map<string,string> metadata = 15; ResolvedNetwork network = 16; MachineTailscale tailscale = 17; GuestConfig guest = 18; MachineStatus status = 19; Observation observation = 20; repeated MachineIssue issues = 21; optional string run_id = 22; BootReport boot_report = 23; ProvisionReport provision_report = 24; google.protobuf.Timestamp started_at = 25; optional string last_error = 26; google.protobuf.Timestamp updated_at = 27; NetworkObservation network_observation = 28; LiveMachineReport live = 29; LiveHostReport prospective_live = 30; optional LiveEvidenceState live_evidence = 31; MachineLifecycle lifecycle = 32; repeated MachineCapture captures = 33; }
message MachineInventoryEntry { string id = 1; string name = 2; MachineSnapshot data = 3; repeated MachineIssue issues = 4; }
message MachineStart { string run_id = 1; MachineSnapshot data = 2; }
enum ReadinessOutcome { READINESS_OUTCOME_UNSPECIFIED = 0; READINESS_OUTCOME_READY = 1; READINESS_OUTCOME_TERMINAL = 2; READINESS_OUTCOME_TIMED_OUT = 3; }
message MachineReadiness { ReadinessOutcome outcome = 1; MachineSnapshot data = 2; MonitorStatus status = 3; }
enum ExitOutcome { EXIT_OUTCOME_UNSPECIFIED = 0; EXIT_OUTCOME_CLEAN = 1; EXIT_OUTCOME_ERROR = 2; EXIT_OUTCOME_ALREADY_STOPPED = 3; EXIT_OUTCOME_FORCED = 4; EXIT_OUTCOME_UNKNOWN = 5; }
message MachineExit { optional string run_id = 1; ExitOutcome outcome = 2; MachineSnapshot data = 3; google.protobuf.Timestamp exited_at = 4; optional string error_message = 5; }
enum LogSource { LOG_SOURCE_UNSPECIFIED = 0; LOG_SOURCE_ALL = 1; LOG_SOURCE_MONITOR = 2; LOG_SOURCE_SERIAL = 3; LOG_SOURCE_EXEC = 4; LOG_SOURCE_NETWORK = 5; LOG_SOURCE_NETWORK_AUDIT = 6; }
enum LogOutput { LOG_OUTPUT_UNSPECIFIED = 0; LOG_OUTPUT_ALL = 1; LOG_OUTPUT_STDOUT = 2; LOG_OUTPUT_STDERR = 3; }
message ReadLogsRequest { string id = 1; LogSource source = 2; LogOutput output = 3; bool follow = 4; optional uint64 tail_bytes = 5; }
message LogChunk { bytes data = 1; LogSource source = 2; LogOutput output = 3; }
message SetMachineSecretRequest { string id = 1; string name = 2; bytes value = 3; }
enum ResourceKind { RESOURCE_KIND_UNSPECIFIED = 0; RESOURCE_KIND_MEMORY = 1; RESOURCE_KIND_ROOT_DISK = 2; }
message ParseResourceRequest { ResourceKind kind = 1; string value = 2; }
message Size { uint64 bytes = 1; }
message NormalizePolicyRequest { oneof input { string hcl = 1; string canonical_json = 2; google.protobuf.Empty empty = 3; } }
enum SecretKind { SECRET_KIND_UNSPECIFIED = 0; SECRET_KIND_PLAIN = 1; SECRET_KIND_OAUTH = 2; }
enum SecretField { SECRET_FIELD_UNSPECIFIED = 0; SECRET_FIELD_VALUE = 1; SECRET_FIELD_OAUTH_ACCESS_TOKEN = 2; SECRET_FIELD_OAUTH_EXPIRES_AT = 3; SECRET_FIELD_OAUTH_ACCOUNT_ID = 4; }
message SecretAlternative { repeated string slots = 1; }
message SecretRequirement { string owner = 1; repeated SecretAlternative alternatives = 2; }
message SecretSlot { string name = 1; bool required = 2; SecretKind kind = 3; string key = 4; SecretField field = 5; }
message PolicyDocument { string canonical_json = 1; string hcl = 2; repeated SecretSlot secret_slots = 3; repeated SecretRequirement secret_requirements = 4; }
message CheckPolicySecretsRequest { string policy_json = 1; optional string machine_id = 2; }
enum PolicySecretsState { POLICY_SECRETS_STATE_UNSPECIFIED = 0; POLICY_SECRETS_STATE_READY = 1; POLICY_SECRETS_STATE_MISSING = 2; POLICY_SECRETS_STATE_UNAVAILABLE = 3; }
message SecretDiagnostic { string slot = 1; optional string key = 2; string code = 3; }
message PolicySecretsResult { PolicySecretsState state = 1; repeated SecretDiagnostic diagnostics = 2; repeated SecretRequirement requirements = 3; repeated SecretSlot slots = 4; }
enum ErrorKind { ERROR_KIND_UNSPECIFIED = 0; ERROR_KIND_INVALID = 1; ERROR_KIND_MISSING = 2; ERROR_KIND_DUPLICATE = 3; ERROR_KIND_CONFLICT = 4; ERROR_KIND_LIMIT = 5; ERROR_KIND_DENIED = 6; ERROR_KIND_UNAVAILABLE = 7; ERROR_KIND_INTERNAL = 8; }
enum ErrorCode { ERROR_CODE_UNSPECIFIED = 0; ERROR_CODE_ALREADY_RUNNING = 1; ERROR_CODE_NOT_RUNNING = 2; ERROR_CODE_STALE_GENERATION = 3; ERROR_CODE_MONITOR_CONNECTION = 4; ERROR_CODE_ENTRYPOINT_LAUNCH_FAILED = 5; ERROR_CODE_COMMAND_NOT_FOUND = 6; ERROR_CODE_NATIVE = 7; ERROR_CODE_LIVE_OPERATION_UNSUPPORTED = 8; }
message ErrorDetail { ErrorKind kind = 1; ErrorCode code = 2; string safe_message = 3; optional string reference = 4; optional string expected_run = 5; optional string current_run = 6; optional string program = 7; optional string native_variant = 8; optional LaunchFailureReason launch_failure_reason = 9; LiveOperationUnsupported live_unsupported = 10; }
enum LaunchFailureReason { LAUNCH_FAILURE_REASON_UNSPECIFIED = 0; LAUNCH_FAILURE_REASON_COMMAND_NOT_FOUND = 1; LAUNCH_FAILURE_REASON_INVALID_PROCESS_SPEC = 2; LAUNCH_FAILURE_REASON_WORKING_DIRECTORY_NOT_FOUND = 3; LAUNCH_FAILURE_REASON_WORKING_DIRECTORY_NOT_DIRECTORY = 4; LAUNCH_FAILURE_REASON_INVALID_IDENTITY = 5; LAUNCH_FAILURE_REASON_IDENTITY_NOT_FOUND = 6; LAUNCH_FAILURE_REASON_PERMISSION_DENIED = 7; LAUNCH_FAILURE_REASON_SPAWN_FAILED = 8; LAUNCH_FAILURE_REASON_CANCELLED_BEFORE_START = 9; }
enum NodeState { NODE_STATE_UNSPECIFIED = 0; NODE_STATE_CONNECTING = 1; NODE_STATE_APPROVAL_REQUIRED = 2; NODE_STATE_READY = 3; NODE_STATE_DISCONNECTED = 4; NODE_STATE_FAILED = 5; NODE_STATE_STOPPED = 6; }
message NodeStatus { string machine_id = 1; string run_id = 2; google.protobuf.Timestamp updated_at = 3; NodeState state = 4; optional string approval_url = 5; optional string dns_name = 6; optional string node_id = 7; repeated string tags = 8; repeated string addresses = 9; google.protobuf.Timestamp key_expiry = 10; optional string error_code = 11; bool key_expiry_known = 12; uint32 version = 13; }
message NodeObservation { string machine_id = 1; google.protobuf.Timestamp observed_at = 2; string node_id = 3; string dns_name = 4; repeated string tags = 5; repeated string addresses = 6; google.protobuf.Timestamp key_expiry = 7; string owner = 8; string tailnet = 9; }
enum NetworkObservationIssue { NETWORK_OBSERVATION_ISSUE_UNSPECIFIED = 0; NETWORK_OBSERVATION_ISSUE_MISSING = 1; NETWORK_OBSERVATION_ISSUE_UNSAFE = 2; NETWORK_OBSERVATION_ISSUE_INVALID = 3; NETWORK_OBSERVATION_ISSUE_STALE = 4; NETWORK_OBSERVATION_ISSUE_WRONG_GENERATION = 5; NETWORK_OBSERVATION_ISSUE_UNAVAILABLE = 6; }
message NetworkObservation { NodeStatus live = 1; NodeObservation historical = 2; repeated NetworkObservationIssue issues = 3; }
enum CorePhase { CORE_PHASE_UNSPECIFIED = 0; CORE_PHASE_STARTING = 1; CORE_PHASE_READY = 2; CORE_PHASE_STOPPING = 3; CORE_PHASE_STOPPED = 4; CORE_PHASE_FAILED = 5; }
enum ComponentState { COMPONENT_STATE_UNSPECIFIED = 0; COMPONENT_STATE_DISABLED = 1; COMPONENT_STATE_STARTING = 2; COMPONENT_STATE_NEEDS_AUTH = 3; COMPONENT_STATE_READY = 4; COMPONENT_STATE_DEGRADED = 5; COMPONENT_STATE_FAILED = 6; }
enum ShutdownProtection { SHUTDOWN_PROTECTION_UNSPECIFIED = 0; SHUTDOWN_PROTECTION_ACTIVE = 1; SHUTDOWN_PROTECTION_UNAVAILABLE = 2; SHUTDOWN_PROTECTION_UNSUPPORTED = 3; }
message ComponentStatus { bool enabled = 1; ComponentState state = 2; optional string diagnostic = 3; optional string approval_url = 4; optional string dns_name = 5; uint64 restart_count = 6; ShutdownProtection shutdown_protection = 7; }
message DaemonStatus { string product_version = 1; uint32 protocol_major = 2; string generation = 3; bytes home = 4; bytes config_dir = 5; CorePhase core = 6; SystemStatus system = 7; ComponentStatus tailscale = 8; uint32 schema = 9; uint32 pid = 10; string process_start = 11; bytes control_endpoint = 12; google.protobuf.Timestamp updated_at = 13; optional string last_error = 14; LiveHostReport manager_live = 15; LiveHostReport appliance_live = 16; optional uint32 live_schema_version = 17; }
message RuntimeComponents { bytes supervisor_path = 1; bytes netd_path = 2; bytes kernel_path = 3; bytes initramfs_path = 4; bytes agent_path = 5; bytes asset_dir = 6; }
message RuntimeInfo { string generation = 1; bytes home = 2; RuntimeComponents components = 3; }
message TailscaleStatusReport { string helper_generation = 1; ComponentStatus status = 2; optional string instance = 3; }
message DrainMutationsRequest { string expected_generation = 1; }
message ResourceDefaults { uint32 cpus = 1; uint64 memory_bytes = 2; uint64 disk_bytes = 3; }
message ResourceCeilings { uint32 cpus = 1; uint64 memory_bytes = 2; uint64 disk_bytes = 3; uint64 vms_per_principal = 4; }
enum EnrollmentMode { ENROLLMENT_MODE_UNSPECIFIED = 0; ENROLLMENT_MODE_OAUTH_APP = 1; ENROLLMENT_MODE_INTERACTIVE = 2; ENROLLMENT_MODE_NONE = 3; }
message TailscaleSettings { reserved 6, 7; reserved "default_image", "allowed_registries"; string hostname = 1; string tag = 2; string control_url = 3; EnrollmentMode enrollment_mode = 4; bool disable_key_expiry = 5; ResourceDefaults defaults = 8; ResourceCeilings ceilings = 9; uint64 sessions_global = 10; uint64 sessions_per_peer = 11; uint64 disk_reserve_bytes = 12; google.protobuf.Duration stop_budget = 13; google.protobuf.Duration shutdown_margin = 14; uint64 file_transfer_limit_bytes = 15; }
// Credentials are one-use bootstrap inputs, never status or configuration output.
message HelperBootstrap { uint32 protocol_major = 1; string product_version = 2; string daemon_generation = 3; string helper_generation = 4; bytes control_endpoint = 5; bytes home = 6; bytes config_dir = 7; optional bytes templates_dir = 8; optional bytes policies_dir = 9; RuntimeComponents runtime_components = 10; bytes native_bridge_path = 11; TailscaleSettings settings = 12; optional bytes client_secret = 13; optional bytes oauth_app_secret = 14; optional bytes api_token = 15; }

enum VmState { VM_STATE_UNSPECIFIED = 0; VM_STATE_STARTING = 1; VM_STATE_RUNNING = 2; VM_STATE_STOPPING = 3; VM_STATE_STOPPED = 4; VM_STATE_FAILED = 5; VM_STATE_PAUSING = 6; VM_STATE_PAUSED = 7; VM_STATE_CAPTURING = 8; VM_STATE_RESTORING = 9; VM_STATE_ACTIVATING = 10; VM_STATE_ACTIVATION_FAILED = 11; VM_STATE_ERROR = 12; }
enum ReadinessReason { READINESS_REASON_UNSPECIFIED = 0; READINESS_REASON_VM_STARTING = 1; READINESS_REASON_VM_STOPPING = 2; READINESS_REASON_VM_STOPPED = 3; READINESS_REASON_VM_FAILED = 4; READINESS_REASON_AGENT_NOT_REQUIRED = 5; READINESS_REASON_AGENT_UNAVAILABLE = 6; READINESS_REASON_AGENT_STATUS_STALE = 7; READINESS_REASON_GUEST_STARTING = 8; READINESS_REASON_GUEST_FAILED = 9; READINESS_REASON_GUEST_REPORTED_READY = 10; READINESS_REASON_VM_PAUSING = 11; READINESS_REASON_VM_PAUSED = 12; READINESS_REASON_VM_CAPTURING = 13; READINESS_REASON_VM_RESTORING = 14; READINESS_REASON_VM_ACTIVATING = 15; READINESS_REASON_VM_ACTIVATION_FAILED = 16; READINESS_REASON_VM_ERROR = 17; }
enum AgentConnectionState { AGENT_CONNECTION_STATE_UNSPECIFIED = 0; AGENT_CONNECTION_STATE_CONNECTING = 1; AGENT_CONNECTION_STATE_RESPONSIVE = 2; AGENT_CONNECTION_STATE_UNRESPONSIVE = 3; }
enum Freshness { FRESHNESS_UNSPECIFIED = 0; FRESHNESS_FRESH = 1; FRESHNESS_STALE = 2; }
enum StaleReason { STALE_REASON_UNSPECIFIED = 0; STALE_REASON_RECEIPT_AGE = 1; STALE_REASON_MONITOR_STOPPING = 2; }
enum AgentStatusState { AGENT_STATUS_STATE_UNSPECIFIED = 0; AGENT_STATUS_STATE_STARTING = 1; AGENT_STATUS_STATE_READY = 2; AGENT_STATUS_STATE_FAILED = 3; }
enum SshBackend { SSH_BACKEND_UNSPECIFIED = 0; SSH_BACKEND_NATIVE = 1; SSH_BACKEND_OPEN_SSH = 2; SSH_BACKEND_SYSTEMD_OPEN_SSH = 3; }
message MonitorSnapshot { string instance_id = 1; google.protobuf.Timestamp observed_at = 2; }
message VmSnapshot { VmState state = 1; google.protobuf.Timestamp state_changed_at = 2; google.protobuf.Timestamp running_since = 3; optional string code = 4; optional string message = 5; }
message ReadinessState { bool ready = 1; ReadinessReason reason = 2; }
message AgentConnection { AgentConnectionState state = 1; google.protobuf.Timestamp last_success_at = 2; google.protobuf.Timestamp last_failure_at = 3; optional string code = 4; optional string message = 5; }
message AgentIdentity { string instance_id = 1; string version = 2; string boot_id = 3; }
message SystemInfo { optional string kernel_version = 1; optional string os_name = 2; optional string os_version = 3; optional string architecture = 4; optional string hostname = 5; repeated string ip_addresses = 6; }
message SshListenerReport { SshBackend backend = 1; uint32 port = 2; string host_public_key = 3; bool config_verified = 4; bool kex_verified = 5; }
message GuestProvisionReport { ProvisionStatus status = 1; google.protobuf.Timestamp started_at = 2; google.protobuf.Timestamp finished_at = 3; google.protobuf.Duration duration = 4; optional string message = 5; repeated ProvisionStepReport steps = 6; }
message AgentStatusReport { google.protobuf.Timestamp observed_at = 1; AgentStatusState state = 2; optional string code = 3; optional string message = 4; SystemInfo system = 5; BootReport boot = 6; GuestProvisionReport provisioning = 7; SshListenerReport ssh = 8; }
message AgentStatusObservation { google.protobuf.Timestamp received_at = 1; google.protobuf.Timestamp stale_at = 2; Freshness freshness = 3; optional StaleReason stale_reason = 4; AgentStatusReport report = 5; }
message EnabledAgent { AgentConnection connection = 1; AgentIdentity identity = 2; AgentStatusObservation status = 3; repeated string services = 4; }
message AgentStatus { oneof status { google.protobuf.Empty disabled = 1; EnabledAgent enabled = 2; } }
message MonitorStatus { string machine_id = 1; optional string run_id = 2; string name = 3; MonitorSnapshot monitor = 4; VmSnapshot vm = 5; ReadinessState readiness = 6; AgentStatus agent = 7; LiveMachineReport live = 8; LiveLifecycle lifecycle = 9; }

enum SystemPhase { SYSTEM_PHASE_UNSPECIFIED = 0; SYSTEM_PHASE_PREPARING_STORAGE = 1; SYSTEM_PHASE_CREATING = 2; SYSTEM_PHASE_STARTING_VM = 3; SYSTEM_PHASE_WAITING_GUEST = 4; SYSTEM_PHASE_ACTIVATING_ENGINE = 5; SYSTEM_PHASE_RETRYING = 6; SYSTEM_PHASE_READY = 7; SYSTEM_PHASE_DEGRADED = 8; SYSTEM_PHASE_UPGRADING = 9; SYSTEM_PHASE_FAILED = 10; SYSTEM_PHASE_STOPPING = 11; SYSTEM_PHASE_STOPPED = 12; }
enum MemoryReclaimOutcome { MEMORY_RECLAIM_OUTCOME_UNSPECIFIED = 0; MEMORY_RECLAIM_OUTCOME_RECLAIMED = 1; MEMORY_RECLAIM_OUTCOME_PARTIAL = 2; MEMORY_RECLAIM_OUTCOME_NOTHING = 3; MEMORY_RECLAIM_OUTCOME_FAILED = 4; }
message SystemStatus { SystemPhase phase = 1; optional string machine_id = 2; optional string run_id = 3; optional string image_digest = 4; optional string configured_image = 5; optional uint64 memory_bytes = 6; optional string actual_backend = 7; bytes docker_socket = 8; optional string last_error = 9; uint64 restart_count = 10; google.protobuf.Timestamp update_checked_at = 11; optional string update_error = 12; optional MemoryReclaimOutcome memory_reclaim_outcome = 13; optional string memory_reclaim_mode = 14; optional uint64 memory_reclaim_observed_cache_delta_bytes = 15; google.protobuf.Timestamp memory_reclaim_at = 16; optional uint64 memory_reclaim_runs = 17; bool host_memory_reclaim_requested = 18; optional bool host_memory_reclaim_effective = 19; optional string host_memory_reclaim_qualification = 20; optional uint64 host_memory_reclaim_released_bytes = 21; optional uint64 host_memory_reclaim_failed_operations = 22; LiveMachineReport live = 23; LiveHostReport prospective_live = 24; optional uint32 live_schema_version = 25; optional string host_memory_reclaim_backing = 26; optional string host_memory_reclaim_reason = 27; }

message LiveMachineRequest { MachineRef machine = 1; }
message PauseOwner { oneof owner { google.protobuf.Empty user = 1; string capture_operation_id = 2; } }
message PauseToken { string machine_id = 1; string run_id = 2; uint64 generation = 3; PauseOwner owner = 4; }
message CurrentPause { PauseToken token = 1; string operation_id = 2; uint64 freeze_epoch = 3; }
enum LiveCommandKind { LIVE_COMMAND_KIND_UNSPECIFIED = 0; LIVE_COMMAND_KIND_PAUSE = 1; LIVE_COMMAND_KIND_RESUME = 2; LIVE_COMMAND_KIND_GET_OPERATION = 3; LIVE_COMMAND_KIND_CANCEL_OPERATION = 4; LIVE_COMMAND_KIND_CAPTURE = 5; LIVE_COMMAND_KIND_RELEASE_CAPTURE = 6; }
enum LiveStage { LIVE_STAGE_UNSPECIFIED = 0; LIVE_STAGE_MONITOR_DRAIN = 1; LIVE_STAGE_GUEST_FREEZE = 2; LIVE_STAGE_NATIVE_PAUSE = 3; LIVE_STAGE_PAUSE_FAILED = 4; LIVE_STAGE_ROLLBACK_THAW = 5; LIVE_STAGE_CANCEL_NATIVE = 6; LIVE_STAGE_CANCEL_THAW = 7; LIVE_STAGE_RESUME_NATIVE = 8; LIVE_STAGE_RESUME_CLOCK = 9; LIVE_STAGE_RESUME_HANDSHAKE = 10; LIVE_STAGE_RESUME_THAW = 11; LIVE_STAGE_READINESS = 12; LIVE_STAGE_RECOVERY_FREEZE = 13; LIVE_STAGE_RECOVERY_PAUSE = 14; LIVE_STAGE_ADMISSION = 15; LIVE_STAGE_CAPTURE_PREPARE = 16; LIVE_STAGE_CAPTURE_FLUSH = 17; LIVE_STAGE_CAPTURE_DISKS = 18; LIVE_STAGE_CAPTURE_EXECUTION = 19; LIVE_STAGE_CAPTURE_MEMORY = 20; LIVE_STAGE_CAPTURE_VERIFY = 21; LIVE_STAGE_CAPTURE_SEAL = 22; LIVE_STAGE_CAPTURE_ACCEPT = 23; LIVE_STAGE_CAPTURE_ABANDON = 24; LIVE_STAGE_CAPTURE_PRESERVE = 25; LIVE_STAGE_CAPTURE_SOURCE_RECORD = 26; LIVE_STAGE_CAPTURE_RELEASE = 27; }
enum LiveFailureCode { LIVE_FAILURE_CODE_UNSPECIFIED = 0; LIVE_FAILURE_CODE_DRAIN_TIMED_OUT = 1; LIVE_FAILURE_CODE_GUEST_UNAVAILABLE = 2; LIVE_FAILURE_CODE_GUEST_IDENTITY_MISMATCH = 3; LIVE_FAILURE_CODE_FREEZE_FAILED = 4; LIVE_FAILURE_CODE_FREEZE_TIMED_OUT = 5; LIVE_FAILURE_CODE_NATIVE_PAUSE_FAILED = 6; LIVE_FAILURE_CODE_NATIVE_UNCERTAIN = 7; LIVE_FAILURE_CODE_CANCELLED = 8; LIVE_FAILURE_CODE_NATIVE_ROLLBACK_FAILED = 9; LIVE_FAILURE_CODE_THAW_FAILED = 10; LIVE_FAILURE_CODE_THAW_UNACKNOWLEDGED = 11; LIVE_FAILURE_CODE_NATIVE_RESUME_FAILED = 12; LIVE_FAILURE_CODE_CLOCK_GENERATION_FAILED = 13; LIVE_FAILURE_CODE_HANDSHAKE_FAILED = 14; LIVE_FAILURE_CODE_READINESS_FAILED = 15; LIVE_FAILURE_CODE_RECOVERY_FREEZE_FAILED = 16; LIVE_FAILURE_CODE_RECOVERY_PAUSE_FAILED = 17; LIVE_FAILURE_CODE_WORKER_LOST = 18; LIVE_FAILURE_CODE_STOPPED = 19; LIVE_FAILURE_CODE_DEADLINE_EXCEEDED = 20; LIVE_FAILURE_CODE_STAGING_FAILED = 21; LIVE_FAILURE_CODE_DISK_FLUSH_FAILED = 22; LIVE_FAILURE_CODE_DISK_COPY_FAILED = 23; LIVE_FAILURE_CODE_EXECUTION_CAPTURE_FAILED = 24; LIVE_FAILURE_CODE_MEMORY_CAPTURE_FAILED = 25; LIVE_FAILURE_CODE_CAPTURE_VERIFICATION_FAILED = 26; LIVE_FAILURE_CODE_SEAL_FAILED = 27; LIVE_FAILURE_CODE_SEAL_UNCERTAIN = 28; LIVE_FAILURE_CODE_BASELINE_ACCEPT_FAILED = 29; LIVE_FAILURE_CODE_PRESERVE_FAILED = 30; LIVE_FAILURE_CODE_ABANDON_FAILED = 31; LIVE_FAILURE_CODE_SOURCE_RECORD_FAILED = 32; LIVE_FAILURE_CODE_RELEASE_FAILED = 33; LIVE_FAILURE_CODE_STAGING_BUDGET_EXCEEDED = 34; }
enum GuestLifecycleState { GUEST_LIFECYCLE_STATE_UNSPECIFIED = 0; GUEST_LIFECYCLE_STATE_RUNNING = 1; GUEST_LIFECYCLE_STATE_FREEZING = 2; GUEST_LIFECYCLE_STATE_FROZEN = 3; GUEST_LIFECYCLE_STATE_ACTIVATING = 4; GUEST_LIFECYCLE_STATE_ACTIVATED_FROZEN = 5; GUEST_LIFECYCLE_STATE_THAWING = 6; GUEST_LIFECYCLE_STATE_THAWED = 7; GUEST_LIFECYCLE_STATE_FREEZE_FAILED = 8; GUEST_LIFECYCLE_STATE_ACTIVATION_FAILED = 9; GUEST_LIFECYCLE_STATE_FAULTED = 10; }
message GuestFreezeObservation { GuestLifecycleState state = 1; optional uint64 freeze_epoch = 2; repeated string workload_roots = 3; repeated string observed_frozen_roots = 4; optional bool rollback_succeeded = 5; optional string failure = 6; }
message LiveFailure { LiveFailureCode code = 1; LiveStage stage = 2; optional string message = 3; GuestFreezeObservation guest = 4; }
message LiveActivity { string operation_id = 1; string request_id = 2; LiveCommandKind command = 3; LiveStage stage = 4; }
message LiveLifecycle { CurrentPause current_pause = 1; LiveActivity activity = 2; LiveFailure error = 3; }
message PauseEstablished { PauseToken token = 1; uint64 freeze_epoch = 2; GuestFreezeObservation guest = 3; bool capture_eligible = 4; }
enum OperationKind { OPERATION_KIND_UNSPECIFIED = 0; OPERATION_KIND_PAUSE = 1; OPERATION_KIND_CAPTURE = 2; }
// A Capture succeeds exactly when its vm.capture.json seal is durable. The cut
// token is historical evidence, never current Resume authority.
message CaptureSealed { string capture_id = 1; string evidence_sha256 = 2; PauseToken cut_token = 3; }
message LiveOperationRecord { string operation_id = 1; OperationKind kind = 2; oneof outcome { google.protobuf.Empty in_progress = 3; PauseEstablished succeeded = 4; LiveFailure failed = 5; CaptureSealed capture_sealed = 6; } }
message MachineLifecycle { LiveMachineReport report = 1; VmState state = 2; LiveLifecycle lifecycle = 3; LiveOperationRecord operation = 4; }
enum CaptureResumePolicy { CAPTURE_RESUME_POLICY_UNSPECIFIED = 0; CAPTURE_RESUME_POLICY_RESUME_IF_ACQUIRED = 1; CAPTURE_RESUME_POLICY_PRESERVE = 2; }
message LiveCaptureRequest { MachineRef machine = 1; optional string name = 2; CaptureResumePolicy resume_policy = 3; }
enum CapturePauseDisposition { CAPTURE_PAUSE_DISPOSITION_UNSPECIFIED = 0; CAPTURE_PAUSE_DISPOSITION_ACQUIRED = 1; CAPTURE_PAUSE_DISPOSITION_BORROWED = 2; }
enum CaptureSourceOutcome { CAPTURE_SOURCE_OUTCOME_UNSPECIFIED = 0; CAPTURE_SOURCE_OUTCOME_RESUMED = 1; CAPTURE_SOURCE_OUTCOME_PRESERVED = 2; CAPTURE_SOURCE_OUTCOME_RESUME_FAILED = 3; CAPTURE_SOURCE_OUTCOME_UNKNOWN = 4; }
// Capture ID equals the Capture request and monitor operation ID. Staging is
// relative to the Silo home and is never restore authority.
message LiveCaptureSummary { string capture_id = 1; string machine_id = 2; string run_id = 3; CaptureResumePolicy resume_policy = 4; CapturePauseDisposition pause = 5; CaptureSourceOutcome source_outcome = 6; optional string source_error = 7; bool released = 8; string staging = 9; }
message LiveSnapshotInfo { StorageSnapshotInfo snapshot = 1; LiveCaptureSummary capture = 2; }
enum MachineCaptureStage { MACHINE_CAPTURE_STAGE_UNSPECIFIED = 0; MACHINE_CAPTURE_STAGE_RESERVED = 1; MACHINE_CAPTURE_STAGE_SEALED = 2; MACHINE_CAPTURE_STAGE_PUBLISHED = 3; }
// A retained, not yet released capture of this machine. source_outcome is
// UNSPECIFIED until the continuation is recorded.
message MachineCapture { string capture_id = 1; string run_id = 2; CaptureResumePolicy resume_policy = 3; CapturePauseDisposition pause = 4; MachineCaptureStage stage = 5; optional string snapshot_id = 6; CaptureSourceOutcome source_outcome = 7; string staging = 8; }
message LiveForkRequest { MachineRef machine = 1; optional string name = 2; }
message LiveRestoreRequest { bytes checkpoint = 1; optional string name = 2; }
// Stopped artifacts are distinct from MachineSnapshot, the observational read model.
message StorageSnapshotRef { oneof reference { string id = 1; string image_alias = 2; } }
message ExternalResourceKey { oneof resource { uint32 disk_order = 1; string share_tag = 2; } }
message ExternalResourceMapping { ExternalResourceKey resource = 1; bytes path = 2; }
message ExternalResourceMappings { repeated ExternalResourceMapping values = 1; }
message ExternalResourcePolicy { oneof policy { google.protobuf.Empty reject = 1; google.protobuf.Empty require_mappings = 2; ExternalResourceMappings mappings = 3; } }
message StoppedForkRequest { MachineRef machine = 1; optional string name = 2; ExternalResourcePolicy external_resources = 3; }
// Creation records external requirements, never destination host mappings.
// external_resources accepts only reject or require_mappings on this RPC.
message CreateStorageSnapshotRequest { MachineRef machine = 1; optional string name = 2; ExternalResourcePolicy external_resources = 3; }
message RestoreStorageSnapshotRequest { StorageSnapshotRef snapshot = 1; optional string name = 2; ExternalResourcePolicy external_resources = 3; }
enum StorageCaptureKind { STORAGE_CAPTURE_KIND_UNSPECIFIED = 0; STORAGE_CAPTURE_KIND_STOPPED_STORAGE = 1; STORAGE_CAPTURE_KIND_LIVE_EXECUTION = 2; }
// Capture provenance is catalog metadata outside snapshot identity.
message SnapshotCaptureProvenance { string capture_id = 1; string machine_id = 2; string run_id = 3; string evidence_digest = 4; }
message StorageSnapshotInfo { string id = 1; string record_digest = 2; optional bool retained = 3; repeated string aliases = 4; optional int64 created_at = 5; StorageCaptureKind capture_kind = 6; repeated SnapshotCaptureProvenance provenance = 7; }
message StorageSnapshotList { repeated StorageSnapshotInfo snapshots = 1; }
enum LiveOperation { LIVE_OPERATION_UNSPECIFIED = 0; LIVE_OPERATION_PAUSE = 1; LIVE_OPERATION_CAPTURE = 2; LIVE_OPERATION_RESTORE = 3; LIVE_OPERATION_FORK = 4; LIVE_OPERATION_INCREMENTAL = 5; }
enum LiveBackend { LIVE_BACKEND_UNSPECIFIED = 0; LIVE_BACKEND_KRUN = 1; LIVE_BACKEND_VZ = 2; LIVE_BACKEND_MOCK = 3; }
enum LiveLane { LIVE_LANE_UNSPECIFIED = 0; LIVE_LANE_KVM_X86_64 = 1; LIVE_LANE_KVM_ARM64_GIC_V3 = 2; LIVE_LANE_HVF_ARM64 = 3; LIVE_LANE_NOT_APPLICABLE = 4; }
enum LiveScope { LIVE_SCOPE_UNSPECIFIED = 0; LIVE_SCOPE_HOST = 1; LIVE_SCOPE_MACHINE = 2; }
enum LiveReasonCode { LIVE_REASON_CODE_UNSPECIFIED = 0; LIVE_REASON_CODE_BACKEND_EXCLUDED = 1; LIVE_REASON_CODE_HOST_OS_BELOW_FLOOR = 2; LIVE_REASON_CODE_LANE_NOT_QUALIFIED = 3; LIVE_REASON_CODE_HYPERVISOR_UNAVAILABLE = 4; LIVE_REASON_CODE_BUILD_EXCLUDED = 5; LIVE_REASON_CODE_NOT_DELIVERED = 6; LIVE_REASON_CODE_DEVICE_PROFILE_REJECTED = 7; }
message LiveDeviceSubject {
 oneof subject {
  google.protobuf.Empty virtiofs = 1;
  google.protobuf.Empty rosetta = 2;
  google.protobuf.Empty tap = 3;
  google.protobuf.Empty gpu = 4;
  google.protobuf.Empty nested = 5;
  google.protobuf.Empty tee = 6;
  string guest_profile = 7;
 }
}
message LiveUnsupportedReason { optional LiveReasonCode code = 1; LiveDeviceSubject subject = 2; }
message LiveCapability {
 optional bool native = 1;
 oneof availability { google.protobuf.Empty supported = 2; LiveUnsupportedReason unsupported = 3; }
}
message LiveCapabilityVector { LiveCapability pause = 1; LiveCapability capture = 2; LiveCapability restore = 3; LiveCapability fork = 4; LiveCapability incremental = 5; }
message LiveHostReport { optional uint32 schema_version = 1; optional LiveScope scope = 2; optional LiveBackend backend = 3; optional LiveLane lane = 4; LiveCapabilityVector live = 5; optional string build_identity = 6; optional string qualification_identity = 7; optional string scenario_digest = 8; }
message LiveMachineReport { optional uint32 schema_version = 1; optional LiveScope scope = 2; optional string machine_id = 3; optional string run_id = 4; optional string monitor_id = 5; optional LiveBackend backend = 6; optional LiveLane lane = 7; optional uint64 topology_revision = 8; LiveCapabilityVector live = 9; }
message LiveOperationUnsupported { optional LiveOperation operation = 1; optional LiveBackend backend = 2; optional LiveLane lane = 3; LiveUnsupportedReason reason = 4; }
enum LiveEvidenceState { LIVE_EVIDENCE_STATE_UNSPECIFIED = 0; LIVE_EVIDENCE_STATE_RUN = 1; LIVE_EVIDENCE_STATE_PROSPECTIVE = 2; LIVE_EVIDENCE_STATE_UNAVAILABLE = 3; }
