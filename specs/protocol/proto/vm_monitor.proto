syntax = "proto3";

package silo.v1;

import "common.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

service VmMonitorService {
  rpc GetStatus(GetStatusRequest) returns (HostStatus);
  rpc WaitReady(WaitReadyRequest) returns (WaitReadyResponse);
  rpc GetMetrics(GetMetricsRequest) returns (HostMetrics);
  // ADR 0021 live commands for the current run only. A malformed envelope is
  // INVALID_ARGUMENT; every well-formed request receives a typed body.
  rpc Pause(PauseRequest) returns (PauseResponse);
  rpc Resume(ResumeRequest) returns (ResumeResponse);
  rpc GetOperation(GetOperationRequest) returns (GetOperationResponse);
  rpc CancelOperation(CancelOperationRequest) returns (CancelOperationResponse);
  rpc Capture(CaptureRequest) returns (CaptureResponse);
  rpc ReleaseCapture(ReleaseCaptureRequest) returns (ReleaseCaptureResponse);
}

service VmAccessService {
  rpc OpenSsh(stream ByteChunk) returns (stream ByteChunk);
  rpc OpenSerial(stream ByteChunk) returns (stream ByteChunk);
}

message GetStatusRequest {}

message WaitReadyRequest {
  google.protobuf.Duration max_wait = 1;
}

enum WaitReadyOutcome {
  WAIT_READY_OUTCOME_UNSPECIFIED = 0;
  WAIT_READY_OUTCOME_READY = 1;
  WAIT_READY_OUTCOME_TERMINAL = 2;
  WAIT_READY_OUTCOME_TIMED_OUT = 3;
}

message WaitReadyResponse {
  optional WaitReadyOutcome outcome = 1;
  HostStatus status = 2;
}

message GetMetricsRequest {}

enum VmState {
  VM_STATE_UNSPECIFIED = 0;
  VM_STATE_STARTING = 1;
  VM_STATE_RUNNING = 2;
  VM_STATE_STOPPING = 3;
  VM_STATE_STOPPED = 4;
  VM_STATE_FAILED = 5;
  VM_STATE_PAUSING = 6;
  VM_STATE_PAUSED = 7;
  VM_STATE_CAPTURING = 8;
  VM_STATE_RESTORING = 9;
  VM_STATE_ACTIVATING = 10;
  VM_STATE_ACTIVATION_FAILED = 11;
  // Live, fenced and process-owned; only stop leaves it. FAILED stays terminal.
  VM_STATE_ERROR = 12;
}

enum ReadinessReason {
  READINESS_REASON_UNSPECIFIED = 0;
  READINESS_REASON_VM_STARTING = 1;
  READINESS_REASON_VM_STOPPING = 2;
  READINESS_REASON_VM_STOPPED = 3;
  READINESS_REASON_VM_FAILED = 4;
  READINESS_REASON_AGENT_NOT_REQUIRED = 5;
  READINESS_REASON_AGENT_UNAVAILABLE = 6;
  READINESS_REASON_AGENT_STATUS_STALE = 7;
  READINESS_REASON_GUEST_STARTING = 8;
  READINESS_REASON_GUEST_FAILED = 9;
  READINESS_REASON_GUEST_REPORTED_READY = 10;
  READINESS_REASON_VM_PAUSING = 11;
  READINESS_REASON_VM_PAUSED = 12;
  READINESS_REASON_VM_CAPTURING = 13;
  READINESS_REASON_VM_RESTORING = 14;
  READINESS_REASON_VM_ACTIVATING = 15;
  READINESS_REASON_VM_ACTIVATION_FAILED = 16;
  READINESS_REASON_VM_ERROR = 17;
}

enum AgentConnectionState {
  AGENT_CONNECTION_STATE_UNSPECIFIED = 0;
  AGENT_CONNECTION_STATE_CONNECTING = 1;
  AGENT_CONNECTION_STATE_RESPONSIVE = 2;
  AGENT_CONNECTION_STATE_UNRESPONSIVE = 3;
}

enum Freshness {
  FRESHNESS_UNSPECIFIED = 0;
  FRESHNESS_FRESH = 1;
  FRESHNESS_STALE = 2;
}

enum StaleReason {
  STALE_REASON_UNSPECIFIED = 0;
  STALE_REASON_RECEIPT_AGE = 1;
  STALE_REASON_MONITOR_STOPPING = 2;
}

message MonitorSnapshot {
  optional string instance_id = 1;
  google.protobuf.Timestamp observed_at = 2;
}

message VmSnapshot {
  optional VmState state = 1;
  google.protobuf.Timestamp state_changed_at = 2;
  google.protobuf.Timestamp running_since = 3;
  optional string code = 4;
  optional string message = 5;
}

message Readiness {
  optional bool ready = 1;
  optional ReadinessReason reason = 2;
}

message AgentConnection {
  optional AgentConnectionState state = 1;
  google.protobuf.Timestamp last_success_at = 2;
  google.protobuf.Timestamp last_failure_at = 3;
  optional string code = 4;
  optional string message = 5;
}

message AgentStatusObservation {
  google.protobuf.Timestamp received_at = 1;
  google.protobuf.Timestamp stale_at = 2;
  optional Freshness freshness = 3;
  optional StaleReason stale_reason = 4;
  AgentStatusReport report = 5;
}

message DisabledAgent {}

message EnabledAgent {
  AgentConnection connection = 1;
  AgentIdentity identity = 2;
  AgentStatusObservation status = 3;
  // Serving Silo service names observed for the current agent instance via
  // gRPC health.
  repeated string services = 4;
}

message HostAgent {
  oneof mode {
    DisabledAgent disabled = 1;
    EnabledAgent enabled = 2;
  }
}

message HostStatus {
  // Generated once when libvm creates the logical machine and retained across
  // every start and restart. It fences this status from another machine record.
  optional string machine_id = 1;
  optional string name = 2;
  MonitorSnapshot monitor = 3;
  VmSnapshot vm = 4;
  Readiness readiness = 5;
  HostAgent agent = 6;
  // Exact libvm run generation. Consumers must reset readiness on mismatch or disconnect.
  optional string run_id = 7;
  // Mandatory, exact run/topology-fenced evidence from the actual backend.
  LiveMachineReport live = 8;
  // Always present: current pause authority, active stage and sticky error.
  LiveLifecycle lifecycle = 9;
}

message AgentMetricsObservation {
  // Fresh at agent startup and rotated during activation. Fences stale metric
  // observations from a captured or replaced runtime instance.
  optional string agent_instance_id = 1;
  google.protobuf.Timestamp received_at = 2;
  google.protobuf.Timestamp stale_at = 3;
  optional Freshness freshness = 4;
  optional StaleReason stale_reason = 5;
  AgentMetricReport report = 6;
}

message HostMetrics {
  // Generated once when libvm creates the logical machine and retained across
  // every start and restart. It fences these metrics from another machine
  // record.
  optional string machine_id = 1;
  optional string name = 2;
  MonitorSnapshot monitor = 3;
  AgentMetricsObservation metrics = 4;
  // Backend that constructed this running monitor, never a requested/default guess.
  optional string actual_backend = 5;
  // Host memory reclaim state reported by the krun helper. Absent on backends
  // that cannot observe it and before the helper's first report.
  HostMemoryReclaim host_memory_reclaim = 6;
}

message HostMemoryReclaim {
  // Finalized runtime policy, false when structurally inhibited.
  optional bool requested = 1;
  // Host-specific probe outcome: not-run, passed, failed, inconclusive.
  // Linux advice has no qualification probe or qualification prerequisite.
  optional string qualification = 2;
  // Actual permission to reclaim, not proof that any RAM was physically saved.
  optional bool effective = 3;
  // Process-local lifetime successful advice, including repeated bytes/ranges.
  optional uint64 released_bytes = 4;
  optional uint64 released_extents = 5;
  optional uint64 retried_faults = 6;
  // Skipped operations, not a universal count of queue heads or physical pages.
  optional uint64 skipped_reports = 7;
  optional uint64 failed_operations = 8;
  google.protobuf.Timestamp observed_at = 9;
  // Required whenever this report exists: boot or restored-private.
  optional string backing = 10;
  // Structural inhibition: none, tracked-capture, restored-private-mapping.
  // Required whenever this report exists, even when the reason is none.
  optional string reason = 11;
}

enum LiveOperation {
  LIVE_OPERATION_UNSPECIFIED = 0;
  LIVE_OPERATION_PAUSE = 1;
  LIVE_OPERATION_CAPTURE = 2;
  LIVE_OPERATION_RESTORE = 3;
  LIVE_OPERATION_FORK = 4;
  LIVE_OPERATION_INCREMENTAL = 5;
}
enum LiveBackend {
  LIVE_BACKEND_UNSPECIFIED = 0;
  LIVE_BACKEND_KRUN = 1;
  LIVE_BACKEND_VZ = 2;
  LIVE_BACKEND_MOCK = 3;
}
enum LiveLane {
  LIVE_LANE_UNSPECIFIED = 0;
  LIVE_LANE_KVM_X86_64 = 1;
  LIVE_LANE_KVM_ARM64_GIC_V3 = 2;
  LIVE_LANE_HVF_ARM64 = 3;
  LIVE_LANE_NOT_APPLICABLE = 4;
}
enum LiveScope {
  LIVE_SCOPE_UNSPECIFIED = 0;
  LIVE_SCOPE_HOST = 1;
  LIVE_SCOPE_MACHINE = 2;
}
enum LiveReasonCode {
  LIVE_REASON_CODE_UNSPECIFIED = 0;
  LIVE_REASON_CODE_BACKEND_EXCLUDED = 1;
  LIVE_REASON_CODE_HOST_OS_BELOW_FLOOR = 2;
  LIVE_REASON_CODE_LANE_NOT_QUALIFIED = 3;
  LIVE_REASON_CODE_HYPERVISOR_UNAVAILABLE = 4;
  LIVE_REASON_CODE_BUILD_EXCLUDED = 5;
  LIVE_REASON_CODE_NOT_DELIVERED = 6;
  LIVE_REASON_CODE_DEVICE_PROFILE_REJECTED = 7;
}
message LiveDeviceSubject {
  oneof subject {
    google.protobuf.Empty virtiofs = 1;
    google.protobuf.Empty rosetta = 2;
    google.protobuf.Empty tap = 3;
    google.protobuf.Empty gpu = 4;
    google.protobuf.Empty nested = 5;
    google.protobuf.Empty tee = 6;
    string guest_profile = 7;
  }
}
message LiveUnsupportedReason {
  optional LiveReasonCode code = 1;
  LiveDeviceSubject subject = 2;
}
message LiveCapability {
  optional bool native = 1;
  oneof availability {
    google.protobuf.Empty supported = 2;
    LiveUnsupportedReason unsupported = 3;
  }
}
message LiveCapabilityVector {
  LiveCapability pause = 1;
  LiveCapability capture = 2;
  LiveCapability restore = 3;
  LiveCapability fork = 4;
  LiveCapability incremental = 5;
}
message LiveHostReport {
  optional uint32 schema_version = 1;
  optional LiveScope scope = 2;
  optional LiveBackend backend = 3;
  optional LiveLane lane = 4;
  LiveCapabilityVector live = 5;
  optional string build_identity = 6;
  optional string qualification_identity = 7;
  optional string scenario_digest = 8;
}
message LiveMachineReport {
  optional uint32 schema_version = 1;
  optional LiveScope scope = 2;
  optional string machine_id = 3;
  optional string run_id = 4;
  optional string monitor_id = 5;
  optional LiveBackend backend = 6;
  optional LiveLane lane = 7;
  optional uint64 topology_revision = 8;
  LiveCapabilityVector live = 9;
}
message LiveOperationUnsupported {
  optional LiveOperation operation = 1;
  optional LiveBackend backend = 2;
  optional LiveLane lane = 3;
  LiveUnsupportedReason reason = 4;
}

message LiveCommandEnvelope {
  // Canonical lowercase non-nil UUIDs. Machine/run must be this monitor's.
  optional string machine_id = 1;
  optional string run_id = 2;
  // Chosen and persisted by libvm before send; the replay/conflict key.
  optional string request_id = 3;
}

message PauseOwner {
  oneof owner {
    google.protobuf.Empty user = 1;
    string capture_operation_id = 2;
  }
}

// Public projection of exact native pause authority. The opaque native token
// never leaves the worker.
message PauseToken {
  optional string machine_id = 1;
  optional string run_id = 2;
  // Nonzero, strictly increasing per run, including lost-thaw recovery.
  optional uint64 generation = 3;
  PauseOwner owner = 4;
}

// Current authority only, never a historical establishing token.
message CurrentPause {
  PauseToken token = 1;
  optional string operation_id = 2;
  optional uint64 freeze_epoch = 3;
}

message PauseRequest {
  LiveCommandEnvelope envelope = 1;
}

message ResumeRequest {
  LiveCommandEnvelope envelope = 1;
  optional string operation_id = 2;
  PauseToken token = 3;
}

message GetOperationRequest {
  LiveCommandEnvelope envelope = 1;
  optional string operation_id = 2;
}

message CancelOperationRequest {
  LiveCommandEnvelope envelope = 1;
  optional string operation_id = 2;
}

message CaptureRequest {
  LiveCommandEnvelope envelope = 1;
  // Exact canonical vm_spec::capture::CapturePlan JSON. It is the identity
  // record the monitor writes byte-for-byte as captures/<id>/request.json, so
  // it travels as its canonical bytes; non-canonical bytes are rejected.
  optional bytes plan = 2;
}

enum CaptureReleaseDisposition {
  CAPTURE_RELEASE_DISPOSITION_UNSPECIFIED = 0;
  CAPTURE_RELEASE_DISPOSITION_PUBLISHED = 1;
  CAPTURE_RELEASE_DISPOSITION_ABANDONED = 2;
}

message ReleaseCaptureRequest {
  LiveCommandEnvelope envelope = 1;
  optional string operation_id = 2;
  optional CaptureReleaseDisposition disposition = 3;
}

enum OperationKind {
  OPERATION_KIND_UNSPECIFIED = 0;
  OPERATION_KIND_PAUSE = 1;
  OPERATION_KIND_CAPTURE = 2;
}

enum OperationStatus {
  OPERATION_STATUS_UNSPECIFIED = 0;
  OPERATION_STATUS_IN_PROGRESS = 1;
  OPERATION_STATUS_SUCCEEDED = 2;
  OPERATION_STATUS_FAILED = 3;
}

message GuestFreezeObservation {
  optional GuestLifecycleState state = 1;
  optional uint64 freeze_epoch = 2;
  repeated string workload_roots = 3;
  repeated string observed_frozen_roots = 4;
  optional bool rollback_succeeded = 5;
  optional string failure = 6;
}

// Original terminal success of a Pause, immutable for the run lifetime.
message PauseEstablished {
  PauseToken token = 1;
  optional uint64 freeze_epoch = 2;
  GuestFreezeObservation guest = 3;
  optional bool capture_eligible = 4;
}

enum LiveStage {
  LIVE_STAGE_UNSPECIFIED = 0;
  LIVE_STAGE_MONITOR_DRAIN = 1;
  LIVE_STAGE_GUEST_FREEZE = 2;
  LIVE_STAGE_NATIVE_PAUSE = 3;
  LIVE_STAGE_PAUSE_FAILED = 4;
  LIVE_STAGE_ROLLBACK_THAW = 5;
  LIVE_STAGE_CANCEL_NATIVE = 6;
  LIVE_STAGE_CANCEL_THAW = 7;
  LIVE_STAGE_RESUME_NATIVE = 8;
  LIVE_STAGE_RESUME_CLOCK = 9;
  LIVE_STAGE_RESUME_HANDSHAKE = 10;
  LIVE_STAGE_RESUME_THAW = 11;
  LIVE_STAGE_READINESS = 12;
  LIVE_STAGE_RECOVERY_FREEZE = 13;
  LIVE_STAGE_RECOVERY_PAUSE = 14;
  LIVE_STAGE_ADMISSION = 15;
  LIVE_STAGE_CAPTURE_PREPARE = 16;
  LIVE_STAGE_CAPTURE_FLUSH = 17;
  LIVE_STAGE_CAPTURE_DISKS = 18;
  LIVE_STAGE_CAPTURE_EXECUTION = 19;
  LIVE_STAGE_CAPTURE_MEMORY = 20;
  LIVE_STAGE_CAPTURE_VERIFY = 21;
  LIVE_STAGE_CAPTURE_SEAL = 22;
  LIVE_STAGE_CAPTURE_ACCEPT = 23;
  LIVE_STAGE_CAPTURE_ABANDON = 24;
  LIVE_STAGE_CAPTURE_PRESERVE = 25;
  LIVE_STAGE_CAPTURE_SOURCE_RECORD = 26;
  LIVE_STAGE_CAPTURE_RELEASE = 27;
}

enum LiveFailureCode {
  LIVE_FAILURE_CODE_UNSPECIFIED = 0;
  LIVE_FAILURE_CODE_DRAIN_TIMED_OUT = 1;
  LIVE_FAILURE_CODE_GUEST_UNAVAILABLE = 2;
  LIVE_FAILURE_CODE_GUEST_IDENTITY_MISMATCH = 3;
  LIVE_FAILURE_CODE_FREEZE_FAILED = 4;
  LIVE_FAILURE_CODE_FREEZE_TIMED_OUT = 5;
  LIVE_FAILURE_CODE_NATIVE_PAUSE_FAILED = 6;
  LIVE_FAILURE_CODE_NATIVE_UNCERTAIN = 7;
  LIVE_FAILURE_CODE_CANCELLED = 8;
  LIVE_FAILURE_CODE_NATIVE_ROLLBACK_FAILED = 9;
  LIVE_FAILURE_CODE_THAW_FAILED = 10;
  LIVE_FAILURE_CODE_THAW_UNACKNOWLEDGED = 11;
  LIVE_FAILURE_CODE_NATIVE_RESUME_FAILED = 12;
  LIVE_FAILURE_CODE_CLOCK_GENERATION_FAILED = 13;
  LIVE_FAILURE_CODE_HANDSHAKE_FAILED = 14;
  LIVE_FAILURE_CODE_READINESS_FAILED = 15;
  LIVE_FAILURE_CODE_RECOVERY_FREEZE_FAILED = 16;
  LIVE_FAILURE_CODE_RECOVERY_PAUSE_FAILED = 17;
  LIVE_FAILURE_CODE_WORKER_LOST = 18;
  LIVE_FAILURE_CODE_STOPPED = 19;
  LIVE_FAILURE_CODE_DEADLINE_EXCEEDED = 20;
  LIVE_FAILURE_CODE_STAGING_FAILED = 21;
  LIVE_FAILURE_CODE_DISK_FLUSH_FAILED = 22;
  LIVE_FAILURE_CODE_DISK_COPY_FAILED = 23;
  LIVE_FAILURE_CODE_EXECUTION_CAPTURE_FAILED = 24;
  LIVE_FAILURE_CODE_MEMORY_CAPTURE_FAILED = 25;
  LIVE_FAILURE_CODE_CAPTURE_VERIFICATION_FAILED = 26;
  LIVE_FAILURE_CODE_SEAL_FAILED = 27;
  LIVE_FAILURE_CODE_SEAL_UNCERTAIN = 28;
  LIVE_FAILURE_CODE_BASELINE_ACCEPT_FAILED = 29;
  LIVE_FAILURE_CODE_PRESERVE_FAILED = 30;
  LIVE_FAILURE_CODE_ABANDON_FAILED = 31;
  LIVE_FAILURE_CODE_SOURCE_RECORD_FAILED = 32;
  LIVE_FAILURE_CODE_RELEASE_FAILED = 33;
  LIVE_FAILURE_CODE_STAGING_BUDGET_EXCEEDED = 34;
}

message LiveFailure {
  optional LiveFailureCode code = 1;
  optional LiveStage stage = 2;
  optional string message = 3;
  GuestFreezeObservation guest = 4;
}

// Succeeded and sealed are one event for a capture.
message CaptureSealed {
  optional string capture_id = 1;
  // sha256:<hex> of the exact durable vm.capture.json bytes.
  optional string evidence_sha256 = 2;
  // Historical cut token, never current Resume authority by itself.
  PauseToken cut_token = 3;
}

message LiveOperationRecord {
  optional string operation_id = 1;
  optional OperationKind kind = 2;
  optional OperationStatus status = 3;
  oneof result {
    PauseEstablished pause = 4;
    LiveFailure failure = 5;
    CaptureSealed capture = 6;
  }
}

enum LiveCommandKind {
  LIVE_COMMAND_KIND_UNSPECIFIED = 0;
  LIVE_COMMAND_KIND_PAUSE = 1;
  LIVE_COMMAND_KIND_RESUME = 2;
  LIVE_COMMAND_KIND_GET_OPERATION = 3;
  LIVE_COMMAND_KIND_CANCEL_OPERATION = 4;
  LIVE_COMMAND_KIND_CAPTURE = 5;
  LIVE_COMMAND_KIND_RELEASE_CAPTURE = 6;
}

// Present exactly while PAUSING (active stage or failed pause awaiting
// cancel) or CAPTURING (capture stage or post-seal continuation).
message LiveActivity {
  optional string operation_id = 1;
  optional string request_id = 2;
  optional LiveCommandKind command = 3;
  optional LiveStage stage = 4;
}

message LiveLifecycle {
  CurrentPause current_pause = 1;
  LiveActivity activity = 2;
  LiveFailure error = 3;
}

enum LiveRejectionCode {
  LIVE_REJECTION_CODE_UNSPECIFIED = 0;
  LIVE_REJECTION_CODE_WRONG_MACHINE = 1;
  LIVE_REJECTION_CODE_WRONG_RUN = 2;
  LIVE_REJECTION_CODE_REQUEST_CONFLICT = 3;
  LIVE_REJECTION_CODE_INVALID_STATE = 4;
  LIVE_REJECTION_CODE_OPERATION_NOT_FOUND = 5;
  LIVE_REJECTION_CODE_STALE_TOKEN = 6;
  LIVE_REJECTION_CODE_FOREIGN_TOKEN = 7;
  LIVE_REJECTION_CODE_UNSUPPORTED = 8;
  LIVE_REJECTION_CODE_WRONG_TARGET = 9;
  LIVE_REJECTION_CODE_MONITOR_STOPPING = 10;
  LIVE_REJECTION_CODE_INVALID_PLAN = 11;
  LIVE_REJECTION_CODE_CONFIGURATION_MISMATCH = 12;
  LIVE_REJECTION_CODE_CONTINUATION_PENDING = 13;
}

// Typed refusal without effects.
message LiveRejection {
  optional LiveRejectionCode code = 1;
  optional VmState state = 2;
  // Present exactly when code is UNSUPPORTED.
  LiveOperationUnsupported unsupported = 3;
  optional string message = 4;
}

message LiveOperationReceipt {
  optional string operation_id = 1;
  optional OperationKind kind = 2;
  optional VmState state = 3;
}

message PauseResponse {
  oneof outcome {
    LiveOperationReceipt accepted = 1;
    LiveRejection rejected = 2;
  }
}

message CaptureResponse {
  oneof outcome {
    LiveOperationReceipt accepted = 1;
    LiveRejection rejected = 2;
  }
}

// Completion implies RUNNING after clock, transport, thaw and readiness.
message ResumeCompleted {
  PauseToken consumed_token = 1;
  optional uint64 thawed_epoch = 2;
}

// PAUSED: current_pause is the requested token (native kept it parked) or a
// strictly newer recovered authority. ERROR: no authority.
message ResumeFailed {
  LiveFailure cause = 1;
  optional VmState state = 2;
  CurrentPause current_pause = 3;
  LiveFailure recovery_failure = 4;
  PauseToken requested_token = 5;
}

message ResumeResponse {
  oneof outcome {
    ResumeCompleted resumed = 1;
    ResumeFailed failed = 2;
    LiveRejection rejected = 3;
  }
}

enum CaptureRecordOutcome {
  CAPTURE_RECORD_OUTCOME_UNSPECIFIED = 0;
  CAPTURE_RECORD_OUTCOME_COHERENT = 1;
  CAPTURE_RECORD_OUTCOME_FAILED = 2;
}

message CaptureEvidenceReference {
  optional CaptureRecordOutcome outcome = 1;
  optional string sha256 = 2;
}

message CaptureResumeFailed {
  LiveFailure failure = 1;
  optional VmState state = 2;
}

// Source continuation, independent of the capture outcome.
message CaptureContinuation {
  oneof status {
    google.protobuf.Empty pending = 1;
    google.protobuf.Empty unchanged = 2;
    ResumeCompleted resumed = 3;
    CurrentPause preserved = 4;
    CaptureResumeFailed resume_failed = 5;
  }
}

message CaptureReleasedState {
  optional CaptureReleaseDisposition disposition = 1;
  optional bool baseline_retained = 2;
}

message CaptureReleaseState {
  oneof status {
    google.protobuf.Empty retained = 1;
    CaptureReleasedState released = 2;
  }
}

message CaptureObservation {
  CaptureContinuation continuation = 1;
  CaptureReleaseState release = 2;
  CaptureEvidenceReference evidence = 3;
  optional string source_record_sha256 = 4;
}

message OperationObservation {
  LiveOperationRecord operation = 1;
  optional VmState state = 2;
  CurrentPause current_pause = 3;
  LiveActivity activity = 4;
  // Present exactly for a capture operation.
  CaptureObservation capture = 5;
}

message GetOperationResponse {
  oneof outcome {
    OperationObservation observation = 1;
    LiveRejection rejected = 2;
  }
}

message CancelCompleted {
  optional bool effective = 1;
  LiveOperationRecord operation = 2;
  optional VmState state = 3;
}

message CancelFailed {
  LiveFailure cause = 1;
  LiveOperationRecord operation = 2;
  optional VmState state = 3;
}

message CancelOperationResponse {
  oneof outcome {
    CancelCompleted completed = 1;
    CancelFailed failed = 2;
    LiveRejection rejected = 3;
  }
}

message CaptureReleased {
  optional string operation_id = 1;
  optional CaptureReleaseDisposition disposition = 2;
  optional bool baseline_retained = 3;
  optional VmState state = 4;
}

message ReleaseFailed {
  LiveFailure cause = 1;
  optional VmState state = 2;
}

message ReleaseCaptureResponse {
  oneof outcome {
    LiveRejection rejected = 1;
    CaptureReleased released = 2;
    ReleaseFailed failed = 3;
  }
}
