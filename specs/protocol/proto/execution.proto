syntax = "proto3";

package silo.v1;

import "common.proto";
import "guest_process.proto";

service VmExecutionService {
  rpc Execute(stream ExecuteInput) returns (stream ExecutionEvent);
}

message ExecuteInput {
  oneof message {
    StartExecution start = 1;
    StdinData stdin_data = 2;
    CloseStdin close_stdin = 3;
    ResizePty resize_pty = 4;
    SignalProcess signal_process = 5;
  }
}

message StartExecution {
  // Generated once when libvm creates the logical machine and retained across
  // every start and restart. It fences requests from another machine record.
  string machine_id = 1;
  // Generated by libvm before every machine start or restart and valid for
  // that vmmon generation only. It fences stale lifecycle work, controls, and
  // events from stopping, finalizing, or deleting a newer machine generation.
  string machine_run_id = 2;
  // Generated by libvm before it opens an execution and valid for exactly one
  // process attempt within this machine and machine-run generation. It fences
  // stale process controls and events from another execution attempt.
  string execution_id = 3;
  ProcessSpec process = 4;
}

message ExecutionAccepted {}

message ExecutionStarted {}

message ExecutionStdout {
  bytes data = 1;
}

message ExecutionStderr {
  bytes data = 1;
}

message ExecutionTerminalOutput {
  bytes data = 1;
}

message ExecutionExited {
  optional uint32 code = 1;
}

message ExecutionSignaled {
  // Positive Linux signal number that terminated the process.
  optional uint32 signal = 1;
}

message ExecutionLaunchFailed {
  optional LaunchFailureReason reason = 1;
  optional string message = 2;
}

enum LostReason {
  LOST_REASON_UNSPECIFIED = 0;
  LOST_REASON_AGENT_INSTANCE_REPLACED = 1;
  LOST_REASON_AGENT_BOOT_REPLACED = 2;
  LOST_REASON_AGENT_UNAVAILABLE = 3;
  LOST_REASON_GUEST_STREAM_LOST = 4;
  LOST_REASON_VM_STOPPED = 5;
  LOST_REASON_VMMON_EXITED = 6;
}

message ExecutionLost {
  optional LostReason reason = 1;
  optional string message = 2;
}

message ExecutionTerminalResult {
  oneof result {
    ExecutionExited exited = 1;
    ExecutionSignaled signaled = 2;
    ExecutionLaunchFailed launch_failed = 3;
    ExecutionLost lost = 4;
  }
}

message ExecutionEvent {
  oneof event {
    ExecutionAccepted accepted = 2;
    ExecutionStarted started = 3;
    ExecutionStdout stdout = 4;
    ExecutionStderr stderr = 5;
    ExecutionTerminalOutput terminal_output = 6;
    ExecutionExited exited = 7;
    ExecutionSignaled signaled = 8;
    ExecutionLaunchFailed launch_failed = 9;
    ExecutionLost lost = 10;
  }
}
