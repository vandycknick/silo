syntax = "proto3";

package silo.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

message ByteChunk {
  optional bytes data = 1;
}

message ProcessSpec {
  // Required nonempty argv vector. Elements are passed directly to the guest
  // process without shell parsing, joining, or interpolation.
  repeated string argv = 1;
  repeated EnvironmentVariable environment = 2;
  optional string working_directory = 3;
  optional string user = 4;

  // Required stdio mode. Pipe mode with stdin=false represents null stdin.
  oneof stdio {
    PipeStdio pipes = 5;
    PtyStdio pty = 6;
  }
}

message EnvironmentVariable {
  string name = 1;
  string value = 2;
}

message PipeStdio {
  bool stdin = 1;
}

message PtyStdio {
  TerminalSize initial_size = 1;
  optional string terminal = 2;
}

message TerminalSize {
  uint32 columns = 1;
  uint32 rows = 2;
}

message StdinData {
  bytes data = 1;
}

message CloseStdin {}

message ResizePty {
  TerminalSize size = 1;
}

message SignalProcess {
  // Positive Linux signal number delivered to the dedicated process group.
  optional uint32 signal = 1;
}

message AgentIdentity {
  // Fresh at process startup and rotated exactly once on successful activation
  // admission. Fences captured instance-bound requests, controls and events.
  optional string instance_id = 1;
  optional string version = 2;
  // Generated by the guest kernel at boot and valid until that boot ends. It
  // fences stale requests, controls, and events from a replaced guest boot.
  optional string boot_id = 3;
}

enum AgentStatusState {
  AGENT_STATUS_STATE_UNSPECIFIED = 0;
  AGENT_STATUS_STATE_STARTING = 1;
  AGENT_STATUS_STATE_READY = 2;
  AGENT_STATUS_STATE_FAILED = 3;
}

message AgentStatus {
  AgentIdentity identity = 1;
  AgentStatusReport report = 2;
}

message AgentStatusReport {
  google.protobuf.Timestamp observed_at = 1;
  optional AgentStatusState state = 2;
  optional string code = 3;
  optional string message = 4;
  SystemInfo system = 5;
  GuestBootReport boot = 6;
  ProvisionReport provisioning = 7;
  SshListenerReport ssh = 8;
  GuestLifecycleStatus lifecycle = 9;
}

// Prepared by the guest, then KEX-verified by the host against the actual port.
message SshListenerReport {
  string backend = 1;
  uint32 port = 2;
  string host_public_key = 3;
  bool config_verified = 4;
  bool kex_verified = 5;
}

message SystemInfo {
  optional string kernel_version = 1;
  optional string os_name = 2;
  optional string os_version = 3;
  optional string architecture = 4;
  optional string hostname = 5;
  repeated string ip_addresses = 6;
}

enum GuestBootMode {
  GUEST_BOOT_MODE_UNSPECIFIED = 0;
  GUEST_BOOT_MODE_STANDARD = 1;
  GUEST_BOOT_MODE_AGENT_PID1 = 2;
  GUEST_BOOT_MODE_INIT_CHILD = 3;
}

message GuestBootReport {
  optional GuestBootMode mode = 1;
  optional string requested_init = 2;
  optional string handoff_init_path = 3;
  repeated string probed_init_paths = 4;
  optional string agent_path = 5;
  optional uint32 agent_pid = 6;
  optional bool agent_is_pid1 = 7;
  optional string message = 8;
}

enum ProvisionOverallStatus {
  PROVISION_OVERALL_STATUS_UNSPECIFIED = 0;
  PROVISION_OVERALL_STATUS_SUCCEEDED = 1;
  PROVISION_OVERALL_STATUS_DEGRADED = 2;
  PROVISION_OVERALL_STATUS_SKIPPED = 3;
  PROVISION_OVERALL_STATUS_FAILED_BOOT = 4;
}

enum ProvisionStepStatus {
  PROVISION_STEP_STATUS_UNSPECIFIED = 0;
  PROVISION_STEP_STATUS_SUCCEEDED = 1;
  PROVISION_STEP_STATUS_FAILED = 2;
  PROVISION_STEP_STATUS_SKIPPED = 3;
  PROVISION_STEP_STATUS_UNSUPPORTED = 4;
}

enum ProvisionFailurePolicy {
  PROVISION_FAILURE_POLICY_UNSPECIFIED = 0;
  PROVISION_FAILURE_POLICY_BEST_EFFORT = 1;
  PROVISION_FAILURE_POLICY_FAIL_BOOT = 2;
}

message ProvisionReport {
  optional ProvisionOverallStatus status = 1;
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Timestamp finished_at = 3;
  google.protobuf.Duration duration = 4;
  optional string message = 5;
  repeated ProvisionStepReport steps = 6;
}

message ProvisionStepReport {
  optional string id = 1;
  optional ProvisionStepStatus status = 2;
  optional ProvisionFailurePolicy failure_policy = 3;
  optional bool changed = 4;
  optional string backend = 5;
  optional string message = 6;
  optional string error_chain = 7;
  google.protobuf.Duration duration = 8;
}

message AgentMetrics {
  // Fresh at agent startup and rotated during activation. Fences stale metric
  // reports from a captured or replaced runtime instance.
  optional string agent_instance_id = 1;
  AgentMetricReport report = 2;
}

message AgentMetricReport {
  google.protobuf.Timestamp observed_at = 1;
  MetricSnapshot snapshot = 2;
}

message MetricSnapshot {
  MemoryMetrics memory = 1;
  CpuMetrics cpu = 2;
  LoadAverageMetrics load_average = 3;
  optional double uptime_seconds = 4;
  repeated FilesystemMetrics filesystems = 5;
  repeated NetworkInterfaceMetrics network_interfaces = 6;
  repeated BlockDeviceMetrics block_devices = 7;
  // Last guest page-cache reclaim run by the agent. Absent until the first run.
  MemoryReclaimReport memory_reclaim = 8;
  // Present for a verified managed overlay root. This is the writable upper's
  // capacity, not overlay + upper summed together.
  RootStorageMetrics root_storage = 9;
}

message MemoryReclaimReport {
  google.protobuf.Timestamp finished_at = 1;
  // gradual | dropcache
  optional string mode = 2;
  // reclaimed: the request was met; partial: the kernel stopped early;
  // nothing: no reclaimable cache above the floor; failed: the control file
  // could not be written.
  optional string outcome = 3;
  optional uint64 requested_bytes = 4;
  // Cached from /proc/meminfo before and after the run.
  optional uint64 cached_before_bytes = 5;
  optional uint64 cached_after_bytes = 6;
  optional bool compacted = 7;
  // Reclaim runs since the agent started, including this one.
  optional uint64 runs = 8;
}

message MemoryMetrics {
  optional uint64 total_bytes = 1;
  optional uint64 available_bytes = 2;
  // MemFree: pages the guest kernel holds on its free lists.
  optional uint64 free_bytes = 3;
  // Cached: page cache the guest could drop under pressure.
  optional uint64 cached_bytes = 4;
}

message CpuMetrics {
  optional uint32 logical_cpu_count = 1;
  optional double user_seconds = 2;
  optional double nice_seconds = 3;
  optional double system_seconds = 4;
  optional double idle_seconds = 5;
  optional double iowait_seconds = 6;
  optional double irq_seconds = 7;
  optional double softirq_seconds = 8;
  optional double steal_seconds = 9;
}

message LoadAverageMetrics {
  optional double one_minute = 1;
  optional double five_minutes = 2;
  optional double fifteen_minutes = 3;
}

message FilesystemMetrics {
  optional string mount_point = 1;
  optional string filesystem_type = 2;
  optional uint64 total_bytes = 3;
  optional uint64 used_bytes = 4;
  optional uint64 available_bytes = 5;
}

enum RootStorageKind {
  ROOT_STORAGE_KIND_UNSPECIFIED = 0;
  ROOT_STORAGE_KIND_LINUX_FLAT_OVERLAY_V1 = 1;
}

enum TemporaryDirectoryKind {
  TEMPORARY_DIRECTORY_KIND_UNSPECIFIED = 0;
  TEMPORARY_DIRECTORY_KIND_UPPER = 1;
  TEMPORARY_DIRECTORY_KIND_TMPFS = 2;
  // An image-owned mount not backed by the managed upper or tmpfs.
  TEMPORARY_DIRECTORY_KIND_OTHER = 3;
}

message RootStorageMetrics {
  optional RootStorageKind kind = 1;
  optional string upper_profile = 2;
  optional string upper_uuid = 3;
  // Exact private block-device length, including any unusable final tail.
  optional uint64 upper_backing_bytes = 4;
  // Actual ext4 superblock span, not statvfs usable blocks.
  optional uint64 upper_filesystem_bytes = 5;
  optional uint64 unusable_tail_bytes = 6;
  // filesystem span - statvfs usable bytes; excludes application usage.
  optional uint64 filesystem_overhead_bytes = 7;
  optional uint64 upper_usable_bytes = 8;
  optional uint64 upper_used_bytes = 9;
  optional uint64 upper_free_bytes = 10;
  optional uint64 upper_available_bytes = 11;
  optional uint64 upper_total_inodes = 12;
  optional uint64 upper_free_inodes = 13;
  optional uint64 upper_available_inodes = 14;
  // Shared logical lower length, never host physical allocation.
  optional uint64 shared_lower_logical_bytes = 15;
  TemporaryDirectoryMetrics temporary_directory = 16;
}

message TemporaryDirectoryMetrics {
  // Observed at collection time, not inferred from the requested boot policy.
  optional TemporaryDirectoryKind kind = 1;
  optional uint64 capacity_bytes = 2;
  optional uint64 used_bytes = 3;
  optional uint64 free_bytes = 4;
  optional uint64 available_bytes = 5;
  // Unknown for OTHER; upper is persistent, tmpfs is nonpersistent and charged
  // to guest memory. Disk-backed capacity is shared with root, not additional.
  optional bool persistent = 6;
  optional bool memory_charged = 7;
}

message NetworkInterfaceMetrics {
  optional string name = 1;
  optional string mac = 2;
  optional uint64 receive_bytes = 3;
  optional uint64 transmit_bytes = 4;
}

message BlockDeviceMetrics {
  optional string name = 1;
  optional uint64 read_bytes = 2;
  optional uint64 read_operations = 3;
  optional uint64 write_bytes = 4;
  optional uint64 write_operations = 5;
  optional uint64 in_flight_operations = 6;
}

message FreezeRef {
  string machine_id = 1;
  string run_id = 2;
  string operation_id = 3;
  optional uint64 freeze_epoch = 4;
}

enum GuestLifecycleState {
  GUEST_LIFECYCLE_STATE_UNSPECIFIED = 0;
  GUEST_LIFECYCLE_STATE_RUNNING = 1;
  GUEST_LIFECYCLE_STATE_FREEZING = 2;
  GUEST_LIFECYCLE_STATE_FROZEN = 3;
  GUEST_LIFECYCLE_STATE_ACTIVATING = 4;
  GUEST_LIFECYCLE_STATE_ACTIVATED_FROZEN = 5;
  GUEST_LIFECYCLE_STATE_THAWING = 6;
  GUEST_LIFECYCLE_STATE_THAWED = 7;
  GUEST_LIFECYCLE_STATE_FREEZE_FAILED = 8;
  GUEST_LIFECYCLE_STATE_ACTIVATION_FAILED = 9;
  GUEST_LIFECYCLE_STATE_FAULTED = 10;
}

message GuestLifecycleStatus {
  GuestLifecycleState state = 1;
  FreezeRef freeze_ref = 2;
  // Canonical requested roots and actual kernel observations for this attempt.
  // State and rollback outcome determine current ownership after a failure.
  repeated string workload_roots = 3;
  repeated string observed_frozen_roots = 4;
  optional string unsupported_reason = 5;
  optional string failure = 6;
  optional bool rollback_succeeded = 7;
  string machine_id = 8;
  string run_id = 9;
  optional string activation_id = 10;
}
