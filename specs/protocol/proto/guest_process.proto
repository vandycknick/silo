syntax = "proto3";

package silo.v1;

import "common.proto";

service GuestProcessService {
  rpc Execute(stream GuestProcessInput) returns (stream GuestProcessEvent);
}

message GuestProcessInput {
  oneof message {
    StartGuestProcess start = 1;
    StdinData stdin_data = 2;
    CloseStdin close_stdin = 3;
    ResizePty resize_pty = 4;
    SignalProcess signal_process = 5;
  }
}

message StartGuestProcess {
  // Generated by libvm before it opens an execution and valid for exactly one
  // process attempt within its machine and machine-run generation. It fences
  // stale process controls and events from another execution attempt.
  string execution_id = 1;
  // Generated by the guest agent when its process starts and valid for that
  // process lifetime. The caller obtains this expected value from the current
  // agent identity to reject a request targeting a replaced agent instance.
  string expected_agent_instance_id = 2;
  // Generated by the guest kernel at boot and valid until that boot ends. The
  // caller obtains this expected value from the current agent identity to
  // reject a request targeting a replaced guest boot.
  string expected_agent_boot_id = 3;
  ProcessSpec process = 4;
}

message GuestProcessStarted {}

message GuestProcessStdout {
  bytes data = 1;
}

message GuestProcessStderr {
  bytes data = 1;
}

message GuestProcessTerminalOutput {
  bytes data = 1;
}

message GuestProcessExited {
  optional uint32 code = 1;
}

message GuestProcessSignaled {
  // Positive Linux signal number that terminated the process.
  optional uint32 signal = 1;
}

enum LaunchFailureReason {
  LAUNCH_FAILURE_REASON_UNSPECIFIED = 0;
  LAUNCH_FAILURE_REASON_COMMAND_NOT_FOUND = 1;
  LAUNCH_FAILURE_REASON_INVALID_PROCESS_SPEC = 2;
  LAUNCH_FAILURE_REASON_WORKING_DIRECTORY_NOT_FOUND = 3;
  LAUNCH_FAILURE_REASON_WORKING_DIRECTORY_NOT_DIRECTORY = 4;
  LAUNCH_FAILURE_REASON_INVALID_IDENTITY = 5;
  LAUNCH_FAILURE_REASON_IDENTITY_NOT_FOUND = 6;
  LAUNCH_FAILURE_REASON_PERMISSION_DENIED = 7;
  LAUNCH_FAILURE_REASON_SPAWN_FAILED = 8;
  LAUNCH_FAILURE_REASON_CANCELLED_BEFORE_START = 9;
}

message GuestProcessLaunchFailed {
  optional LaunchFailureReason reason = 1;
  optional string message = 2;
}

message GuestProcessEvent {
  oneof event {
    GuestProcessStarted started = 1;
    GuestProcessStdout stdout = 2;
    GuestProcessStderr stderr = 3;
    GuestProcessTerminalOutput terminal_output = 4;
    GuestProcessExited exited = 5;
    GuestProcessSignaled signaled = 6;
    GuestProcessLaunchFailed launch_failed = 7;
  }
}
