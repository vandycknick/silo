[package]
name = "silo-node"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "native/lib.rs"

[dependencies]
libvm = { path = "../../runtime/libvm" }
napi = { version = "3.12.0", features = ["async", "tokio_rt", "napi9"] }
napi-derive = "3.6.1"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["sync"] }
tokio-stream = "0.1.19"
vm-spec = { path = "../../specs/vm-spec" }

[build-dependencies]
napi-build = "2.4.0"
