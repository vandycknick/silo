[package]
name = "init"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "init"
path = "src/main.rs"

[features]
default = ["alloc", "sh"]
alloc = []
sh = ["alloc"]

[dependencies]
rootfs-spec = { path = "../../specs/rootfs-spec" }
disk-partition = { path = "../../common/disk-partition", default-features = false }
libc = { version = "0.2.189", default-features = false }
uuid = { version = "1.24.0", default-features = false }
