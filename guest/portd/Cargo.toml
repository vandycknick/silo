[package]
name = "silo-portd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "silo-portd"
path = "src/main.rs"

[dependencies]
nix = { version = "0.31.3", features = ["fs", "net", "poll", "process", "signal", "socket"] }
serde_json = "1.0.151"

[dev-dependencies]
nix = { version = "0.31.3", features = ["ioctl"] }
tempfile = "3.27.0"
