[package]
name = "krun"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "krun"
path = "src/bin/krun.rs"
required-features = ["krun-bin"]

[features]
krun-bin = ["dep:bzip2", "dep:libkrun", "dep:libkrun-nix-features"]

[dependencies]
utils = { path = "../../common/utils" }
libkrun = { workspace = true, optional = true }
# libkrun v2's vhost-user code uses ancillary messages without enabling nix's uio feature.
libkrun-nix-features = { package = "nix", version = "0.30.1", features = ["uio"], optional = true }
clap = { version = "4.6.4", features = ["derive"] }
eyre = "0.6.12"
nix = { version = "0.31.3", features = ["fs", "poll", "socket", "term"] }
thiserror = "2.0.19"
tracing = "0.1.44"

[target.'cfg(target_arch = "x86_64")'.dependencies]
# libkrun supports Image.bz2 kernels. Keep its bzip2 dependency inside the
# self-contained helper instead of resolving a host libbz2 at runtime.
bzip2 = { version = "0.5.2", features = ["static"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
kvm-ioctls = "0.22.1"
