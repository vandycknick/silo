[package]
name = "krun"
version = "0.1.0"
edition = "2021"

[features]
engine = ["dep:bzip2", "dep:libkrun"]

[dependencies]
libkrun = { workspace = true, optional = true }
nix = { version = "0.31.3", features = ["fs", "poll", "signal", "socket", "uio", "term"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tracing = "0.1.44"

[target.'cfg(target_arch = "x86_64")'.dependencies]
# libkrun supports Image.bz2 kernels. Keep its bzip2 dependency inside the
# self-contained worker instead of resolving a host libbz2 at runtime.
bzip2 = { version = "0.5.2", features = ["static"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
kvm-ioctls = "0.22.1"
