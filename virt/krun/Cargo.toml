[package]
name = "krun"
version.workspace = true
edition = "2021"

[[bin]]
name = "krun"
path = "src/bin/krun.rs"
required-features = ["krun-bin"]

[features]
krun-bin = ["dep:libkrun"]

[dependencies]
utils = { path = "../../common/utils" }
libkrun = { workspace = true, optional = true }
clap = { version = "4.6.1", features = ["derive"] }
eyre = "0.6.12"
nix = { version = "0.31.3", features = ["fs", "poll", "socket", "term"] }
thiserror = "2.0.18"
tracing = "0.1.44"
