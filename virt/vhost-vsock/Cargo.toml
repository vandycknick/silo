[package]
name = "vhost-vsock"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR BSD-3-Clause"

[dependencies]
epoll = "4.4.0"
log = "0.4"
thiserror = "2.0.19"
vhost = { version = "=0.17.0", features = ["vhost-user-backend"] }
vhost-user-backend = "=0.23.0"
virtio-bindings = "=0.2.7"
virtio-queue = "=0.18.0"
virtio-vsock = "=0.12.0"
vm-memory = { version = "=0.18.0", features = ["backend-atomic", "backend-mmap"] }
vmm-sys-util = "=0.15.0"

[dev-dependencies]
tempfile = "3.27.0"
virtio-queue = { version = "=0.18.0", features = ["test-utils"] }
