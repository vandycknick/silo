[package]
name = "oci"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.23.0"
disk-image = { path = "../../common/disk-image" }
containerregistry-image = "0.1.2"
flate2 = "1.1.9"
futures-util = "0.3.33"
nix = { version = "0.31.3", features = ["fs", "user", "feature"] }
oci-client = { version = "0.17.0", default-features = false, features = ["rustls-tls"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "io-util", "sync", "rt"] }
tracing = "0.1.44"
utils = { path = "../../common/utils" }
zstd = "0.13.3"

[dev-dependencies]
tar = "0.4.46"
tempfile = "3.27.0"
